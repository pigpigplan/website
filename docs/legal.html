I18N["fr"].privacy=`<h2>Politique de confidentialité de PigPigPlan</h2>
<p class="meta">Date d'effet : octobre 2026 · Plateformes : iOS / iPadOS / macOS · Version : v1.0</p>
<div class="callout"><strong>Engagement principal.</strong> PigPigPlan est une application locale et respectueuse de la vie privée pour la gestion des finances et des données personnelles. Toutes les données que vous créez dans l'application (y compris les données de santé) sont stockées uniquement sur votre appareil, ne sont jamais téléchargées sur un serveur, et l'exportation est toujours initiée et contrôlée par vous. L'IA intégrée (saisie vocale, requêtes en langage naturel, Q&amp;R santé, recherche sémantique) s'exécute sur un petit modèle embarqué (environ 0,8 Md de paramètres), sans connexion Internet ; la transcription vocale est effectuée sur l'appareil lorsque c'est possible, et le texte reconnu n'est jamais envoyé à nos serveurs.</div>
<h3>1. Données traitées</h3>
<p>Toutes les données sont saisies par vous ou lues après votre autorisation explicite sur votre appareil :</p>
<table><tr><th>Catégorie</th><th>Contenu</th><th>Source</th></tr>
<tr><td>Finances</td><td>Livres de compte, transactions, étiquettes, budgets, plans d'échéances</td><td>Saisie</td></tr>
<tr><td>Santé</td><td>Fréquence cardiaque, VRC (HRV), fréquence au repos, sommeil, respiration, saturation en oxygène, température, pas, séances d'exercice, humeur, cycle menstruel, exposition au soleil</td><td>Apple Health (HealthKit), autorisation par type</td></tr>
<tr><td>Contenu</td><td>Photos de l'album simple (y compris les références à Photos système)</td><td>Votre import / capture / accès autorisé à Photos</td></tr>
<tr><td>Préférences</td><td>Langue, thème, intervalle de mise à jour santé, etc.</td><td>Générées localement</td></tr></table>
<p>Nous ne collectons PAS : nom, e-mail, téléphone, contacts, localisation, identifiant publicitaire (IDFA), etc.</p>
<h3>2. Stockage et traitement</h3>
<ul>
<li><strong>Stockage 100 % local</strong> : les données sont chiffrées (SQLCipher, AES-256) dans une base de données locale.</li>
<li><strong>IA sur l'appareil</strong> : les fonctions d'IA (requêtes en langage naturel, notes vocales, Q&amp;R santé, recherche sémantique) s'exécutent entièrement sur un petit modèle intégré (environ 0,8 Md de paramètres) sur votre appareil. Aucune connexion Internet, Apple Intelligence ni cloud tiers n'est utilisé, et vos requêtes ne quittent jamais l'appareil.</li>

<h3>3. Déclaration spécifique HealthKit</h3>
<p>PigPigPlan lit les données de santé via Apple HealthKit pour l'analyse du stress (basée sur la VRC, la fréquence au repos, le sommeil, etc.) et l'affichage des tendances de santé.</p>
<ul>
<li><strong>Autorisation</strong> : avant tout accès, le système vous demande d'autoriser chaque type de données individuellement ;</li>
<li><strong>Portée</strong> : les données de santé sont traitées localement sur votre appareil, uniquement pour les fins ci-dessus ;</li>
<li><strong>Interdictions</strong> : nous ne les utilisons pas pour la publicité, ne les vendons pas et ne les divulguons à aucun tiers ;</li>

<li><strong>Révocation</strong> : désactivez l'autorisation dans l'app Santé (« Accès aux données ») ou supprimez l'application pour cesser tout accès immédiatement.</li>
</ul>
<h3>4. Exportation des données</h3>
<p>Vous gardez le contrôle total de vos données. L'exportation est toujours initiée par vous :</p>
<ul>
<li>Exportez vos propres données en Excel (.xlsx) ou fichiers, vers votre appareil ou iCloud Drive ;</li>
<li>Données exportables : registres financiers, résultats d'analyse santé, photos d'album ;</li>
<li>L'exportation sert à votre sauvegarde, migration ou analyse personnelle et n'est jamais envoyée automatiquement à un tiers ;</li>
<li>Cette application ne fournit aucun accès API à vos données à des tiers.</li>
</ul>
<h3>5. Sécurité des données</h3>
<ul><li>Base de données chiffrée localement avec SQLCipher (AES-256) ;</li><li>Données de santé traitées dans les conteneurs sécurisés du système Apple ;</li><li>Verrouillage de l'appareil et sécurité du système protègent vos données.</li></ul>
<h3>6. Conservation et suppression</h3>
<table><tr><th>Action</th><th>Résultat</th></tr>
<tr><td>Supprimer un enregistrement</td><td>Suppression immédiate de la base locale</td></tr>

<tr><td>Supprimer l’application</td><td>Suppression des données locales (exportez d’abord manuellement). La copie de sauvegarde automatique reste dans votre propre iCloud Drive (« Fichiers → iCloud Drive → PigPigPlan ») même après la suppression de l’app ; pour l’effacer aussi, supprimez ce dossier dans l’app Fichiers.</td></tr>
<tr><td>Désactiver l'autorisation santé</td><td>L'application cesse immédiatement de lire ce type de données</td></tr></table>
<h3>7. Vie privée des enfants</h3>
<p>L'application ne s'adresse pas aux enfants de moins de 13 ans et ne collecte pas sciemment leurs informations personnelles.</p>
<h3>8. Services tiers</h3>
<p>Aucun service tiers de publicité, de statistique ou de suivi n'est intégré. Seules dépendances : Apple HealthKit / SwiftUI / MLX / WeatherKit (frameworks Apple fonctionnant entièrement sur l'appareil) et bibliothèques locales open source (SQLite, etc.).</p>
<h3>9. Modifications et contact</h3>
<p>Toute modification sera publiée sur cette page avec la date d'effet. Pour toute question, contactez-nous via la page « À propos » de l'application ou les coordonnées du développeur sur l'App Store.</p>
<h3>10. Fonctions nécessitant Internet</h3>
<p>La météo, la carte du trafic, les itinéraires (ETA) et la prévision de trafic, l'achat/restauration de l'abonnement et le premier téléchargement des packs de langue pour la « recherche assistée par traduction » de l'album nécessitent Internet. Seules les informations minimales sont envoyées — vos coordonnées à Apple Weather (le nom de la ville est résolu par Apple Cartes), le contenu cartographique demandé à Apple Cartes pour la carte du trafic, les points de départ/arrivée envoyés à Apple Cartes pour calculer itinéraire et durée (ETA et prévision), et les coordonnées des photos à Apple Cartes pour résoudre les noms de lieux de l'index de l'album — sans données personnelles identifiantes. Toutes les autres fonctions (comptabilité, analyse de santé, reconnaissance vocale sur l'appareil lorsqu'elle est prise en charge, requêtes sémantiques) fonctionnent hors ligne.</p>
<h3>11. Photos système et organisation des photos</h3>
<p>Lors de l'organisation de vos Photos système, l'app lit uniquement les identifiants de référence et les métadonnées (date de prise de vue, lieu, type) via PhotoKit ; elle ne copie ni ne téléverse vos photos. Les étiquettes d'analyse générées sur l'appareil (scènes, texte) sont stockées uniquement dans la base chiffrée locale et peuvent être effacées dans l'app. L'app n'utilise pas les groupes « Personnes et animaux » et ne fait pas de reconnaissance faciale. Pour créer l'index des lieux, l'app envoie les coordonnées des photos (jamais les photos) à Apple Cartes afin de résoudre les noms de lieux ; seul le texte du nom renvoyé est stocké dans la base chiffrée locale.</p>
<h3>12. Sauvegarde et restauration locales</h3>
<p>« Réglages → Sauvegarde » vous permet d’exporter et de restaurer votre propre fichier de sauvegarde.</p>
<ul>
<li>La sauvegarde contient <strong>uniquement</strong> les données métier de votre base chiffrée locale : données financières, listes d’albums, préférences, etc. L’index de recherche (y compris les index vectoriels générés sur l’appareil à partir des photos, des résumés de santé, etc.) réside dans une base vectorielle séparée et <strong>n’est jamais inclus dans la sauvegarde</strong> ; il est reconstruit sur l’appareil après la restauration.</li>
<li>La sauvegarde <strong>ne contient pas de données de santé</strong> (ni les échantillons lus depuis Apple Santé, ni l’analyse de stress calculée sur l’appareil). Ces données restent toujours détenues par l’app Santé d’Apple ; après une nouvelle autorisation sur un nouvel appareil, elles se resynchronisent automatiquement : il n’est ni nécessaire ni souhaitable d’en faire une copie.</li>

</ul>

ues.</li><li>Requête personnalisée → plusieurs comptes, mot-clé du libellé/notes, plusieurs étiquettes et période, résultats paginés.</li><li>Gestion des plans → suspendre, reprendre, annuler ou marquer la période en cours comme payée pour les échéances/abonnements ; chaque action demande confirmation.</li><li>Modifier ou supprimer après saisie → chaque ligne de la liste affiche « ✎ Modifier » et « 🗑 Supprimer » (sur iOS, un glissement vers la gauche supprime et un appui long ouvre un menu « Modifier / Supprimer ») ; un résultat de recherche s'ouvre en fiche plein écran au toucher, où vous pouvez le modifier ou le supprimer. Toute suppression demande confirmation.</li></ul>

<h3>7. Recherche</h3>
<p><strong>Entrée :</strong> un mot-clé, une question ou une commande vocale — chaque module ne cherche que dans ses propres données.</p>
<ul><li>Finances → poser une question en langage naturel (« combien en restauration ce mois »), lancer une requête personnalisée (comptes + mot-clé + étiquettes + période) ou donner une commande de plan (suspendre / reprendre / annuler / marquer la période payée → fiche de confirmation d'abord).</li><li>Santé → interroger ses propres données de santé (« quels jours le stress était le plus élevé », « comment était mon sommeil cette semaine ») → calculé et répondu sur l'appareil.</li><li>Album → filtrer par temps / lieu / type ou utiliser des commandes vocales ; les noms de lieux peuvent aussi être comparés en anglais via Apple Traduction (téléchargement du pack de langue à la première utilisation).</li><li>Toutes les analyses et tous les calculs se font sur l'appareil ; requêtes et résultats ne sont jamais téléversés.</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Saisir « transport le mois dernier » → les écritures financières correspondantes avec le total.</li><li>Demander « comment était mon sommeil cette semaine » → une réponse à partir de vos données de sommeil, sur l'appareil.</li><li>Dire « photos de Séoul l'an dernier » → la grille de l'album se réduit à ces photos.</li></ul>
<h3>8. Abonnement (Pro)</h3>
<p><strong>Entrée :</strong> touchez une formule (mensuel / annuel), « Restaurer les achats » ou « Gérer l'abonnement ».</p>
<ul><li>Toucher une formule → la feuille d'achat Apple apparaît → confirmer → toutes les fonctions sont débloquées.</li><li>Toucher « Restaurer les achats » → un achat précédent est récupéré (Internet requis).</li><li>Toucher « Gérer l'abonnement » → modifier ou résilier sur la page d'Apple ; la facturation est gérée par Apple.</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Toucher « Annuel » → confirmer dans la feuille Apple → Pro débloqué.</li><li>Toucher « Restaurer les achats » → un abonnement antérieur est restauré.</li><li>Toucher « Gérer l'abonnement » → la page d'abonnements d'Apple s'ouvre.</li></ul>
<h3>9. Réglages &amp; langue</h3>
<p><strong>Entrée :</strong> choisissez une langue, un thème ou une action sur les données.</p>
<ul><li>Changer langue / thème / intervalle d'actualisation → l'interface se met à jour aussitôt.</li><li>Effacer les données / gérer les autorisations / exporter → l'écran correspondant s'ouvre.</li><li>Plateforme et langues → iOS / iPadOS / macOS, 8 langues d'interface, thèmes, Dynamic Type et mode confidentialité (montants masqués en ******).</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Mettre la langue en anglais → toute l'app bascule aussitôt.</li><li>Passer au thème sombre → les couleurs changent aussitôt.</li></ul>
<h3>10. Export &amp; sauvegarde</h3>
<p><strong>Entrée :</strong> choisissez ce qu'il faut exporter (finances / analyse santé / album).</p>
<ul><li>Exporter → un fichier (Excel .xlsx) est produit et enregistré sur votre appareil ou iCloud Drive.</li><li>Les exports sont toujours déclenchés par vous ; rien n'est envoyé automatiquement.</li><li>Sauvegarde automatique → une sauvegarde est créée lorsque la base change, avec le rappel « dernière sauvegarde il y a N jours » ; la restauration fusionne (ajoute seulement).</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Exporter les finances du mois → un fichier .xlsx dans Fichiers.</li><li>Exporter un album → les photos écrites à l'emplacement choisi.</li></ul>
<h3>11. Autorisations &amp; confidentialité</h3>
<p><strong>Entrée :</strong> activez/désactivez une autorisation dans les Réglages système, ou supprimez l'app.</p>
<ul><li>Santé → révoquez à tout moment dans l'app Santé → « Accès aux données &amp; appareils ».</li><li>Photos → Réglages → Confidentialité et sécurité → Photos.</li><li>Micro / reconnaissance vocale → Réglages → Confidentialité et sécurité.</li><li>Supprimer l'app → toutes les données locales sont effacées (exportez avant).</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Révoquer Photos dans Réglages → la grille d'album ne lit plus de nouvelles photos.</li><li>Supprimer l'app → base locale effacée ; l'app est réinitialisée.</li></ul>`;

I18N["es"].privacy=`<h2>Política de privacidad de PigPigPlan</h2>
<p class="meta">Fecha de entrada en vigor: octubre de 2026 · Plataformas: iOS / iPadOS / macOS · Versión: v1.0</p>
<div class="callout"><strong>Compromiso principal.</strong> PigPigPlan es una aplicación local y centrada en la privacidad para la gestión de finanzas y datos personales. Todos los datos que creas en la aplicación (incluidos los datos de salud) se almacenan únicamente en tu dispositivo, nunca se suben a ningún servidor, y la exportación siempre la inicias y controlas tú. La IA integrada (entrada por voz, consultas en lenguaje natural, preguntas y respuestas de salud, búsqueda semántica) se ejecuta en un pequeño modelo incluido (unos 0,8 mil millones de parámetros), sin conexión a Internet; la transcripción de voz se realiza en el dispositivo cuando es posible y el texto reconocido nunca se sube a nuestros servidores.</div>
<h3>1. Datos tratados</h3>
<p>Todos los datos son introducidos por ti o leídos con tu autorización explícita en tu dispositivo:</p>
<table><tr><th>Categoría</th><th>Contenido</th><th>Fuente</th></tr>
<tr><td>Finanzas</td><td>Libros de cuentas, transacciones, etiquetas, presupuestos, planes a plazos</td><td>Tu entrada</td></tr>
<tr><td>Salud</td><td>Frecuencia cardíaca, VFC (HRV), frecuencia en reposo, sueño, respiración, saturación de oxígeno, temperatura, pasos, entrenamientos, estado de ánimo, ciclo menstrual, exposición solar</td><td>Apple Health (HealthKit), autorización por tipo</td></tr>
<tr><td>Contenido</td><td>Fotos del álbum sencillo (incluidas referencias a Fotos del sistema)</td><td>Tu importación / captura / acceso autorizado a Fotos</td></tr>
<tr><td>Preferencias</td><td>Idioma, tema, intervalo de actualización de salud, etc.</td><td>Generadas localmente</td></tr></table>
<p><strong>NO recopilamos</strong>: nombre, correo, teléfono, contactos, ubicación, identificador publicitario (IDFA), etc.</p>
<h3>2. Almacenamiento y tratamiento</h3>
<ul>
<li><strong>100 % almacenamiento local</strong>: los datos se cifran (SQLCipher, AES-256) en una base de datos local.</li>
<li><strong>IA en el dispositivo</strong>: las funciones de IA (consultas en lenguaje natural, notas de voz, preguntas y respuestas de salud, búsqueda semántica) se ejecutan por completo en un pequeño modelo integrado (unos 0,8 mil millones de parámetros) en tu dispositivo. No se usa conexión a Internet, Apple Intelligence ni ninguna nube de terceros, y tus consultas nunca salen de él.</li>
<li><strong>Voz, mapas y salud:</strong> la transcripción de voz se realiza en el dispositivo cuando es posible; crear un álbum por voz siempre exige reconocimiento en el dispositivo. Si el dispositivo o el idioma no lo admiten, el servicio de reconocimiento de voz de Apple procesa el audio (requiere conexión); el texto reconocido se procesa solo en el dispositivo y nunca se sube a nuestros servidores. Solo el tiempo, el mapa de tráfico, las rutas (ETA), la previsión de tráfico y el índice de lugares del álbum envían datos a Apple (coordenadas a Apple Weather, nombres de ciudades con Apple Maps; el mapa de tráfico lo dibuja Apple Maps; inicio/fin se calculan en Apple Maps para el ETA y la previsión, que pide una duración estimada por franja horaria del día; coordenadas de fotos para el índice): las fotos nunca se envían. El inicio/fin y las rutas favoritas y recientes que definas en la portada se guardan solo en los ajustes locales del dispositivo y nunca se envían. Los datos de salud se leen tras tu autorización; los registros manuales (incluidos los confirmados por voz) se escriben en Apple Salud (HealthKit) tras tu autorización.</li>
<li><strong>Sin servidor, sin cuenta:</strong> no operamos ningún servidor que reciba tus datos; no se requiere registro; sin publicidad, estadísticas ni SDK de seguimiento de terceros. (Las copias automáticas se guardan en <strong>tu propio</strong> iCloud Drive, no en nuestros servidores.)</li>
<li><strong>Finalidad</strong>: los datos sirven solo a tus funciones personales — contabilidad, análisis de estrés, búsqueda semántica, gestión de fotos.</li>
</ul>
<h3>3. Declaración específica sobre HealthKit</h3>
<p>PigPigPlan lee datos de salud a través de Apple HealthKit para el análisis de estrés (basado en VFC, frecuencia cardíaca en reposo, sueño, etc.) y la visualización de tendencias de salud.</p>
<ul>
<li><strong>Autorización</strong>: antes del acceso, el sistema te pide autorizar cada tipo de datos individualmente;</li>
<li><strong>Alcance</strong>: los datos de salud se procesan localmente en tu dispositivo, solo para los fines anteriores;</li>
<li><strong>Prohibiciones</strong>: no los usamos para publicidad, no los vendemos ni los divulgamos a terceros;</li>
<li><strong>Escritura:</strong> los registros de salud introducidos manualmente (incluidos los confirmados por voz) se escriben en Apple Salud (HealthKit) tras tu autorización, solo para los tipos permitidos; revocar el acceso detiene también la escritura.</li>
<li><strong>Revocación</strong>: desactiva la autorización en la app Salud («Acceso a datos») o elimina la aplicación para detener todo acceso inmediatamente.</li>
</ul>
<h3>4. Exportación de datos</h3>
<p>Tienes el control total de tus datos. La exportación siempre la inicias tú:</p>
<ul>
<li>Exporta tus propios datos a Excel (.xlsx) o archivos, a tu dispositivo o a iCloud Drive;</li>
<li>Datos exportables: registros financieros, resultados de análisis de salud, fotos del álbum;</li>
<li>La exportación es solo para tu copia de seguridad, migración o análisis personal y nunca se envía automáticamente a terceros;</li>
<li>Esta aplicación no ofrece acceso API a tus datos a terceros.</li>
</ul>
<h3>5. Seguridad de los datos</h3>
<ul><li>Base de datos cifrada localmente con SQLCipher (AES-256);</li><li>Los datos de salud se procesan en los contenedores seguros del sistema de Apple;</li><li>El bloqueo del dispositivo y la seguridad del sistema protegen tus datos.</li></ul>
<h3>6. Conservación y eliminación</h3>
<table><tr><th>Acción</th><th>Resultado</th></tr>
<tr><td>Eliminar un registro</td><td>Eliminación inmediata de la base local</td></tr>
<tr><td>Eliminar un libro / álbum</td><td>Se eliminan sus datos asociados</td></tr>
<tr><td>Eliminar la aplicación</td><td>Se eliminan los datos locales (exporta antes manualmente). La copia de seguridad automática permanece en tu propio iCloud Drive («Archivos → iCloud Drive → PigPigPlan») aunque elimines la app; para borrarla también, elimina esa carpeta en la app Archivos.</td></tr>
<tr><td>Desactivar la autorización de salud</td><td>La aplicación deja de leer ese tipo inmediatamente</td></tr></table>
<h3>7. Privacidad de los menores</h3>
<p>La aplicación no está dirigida a menores de 13 años y no recopila a sabiendas su información personal.</p>
<h3>8. Servicios de terceros</h3>
<p>No se integra ningún servicio de publicidad, estadística o seguimiento de terceros. Únicas dependencias: Apple HealthKit / SwiftUI / MLX / WeatherKit (frameworks de Apple que funcionan por completo en el dispositivo) y bibliotecas locales de código abierto (SQLite, etc.).</p>
<h3>9. Cambios y contacto</h3>
<p>Los cambios se publicarán en esta página con su fecha de entrada en vigor. Para cualquier duda, contáctanos a través de la página «Acerca de» de la aplicación o los datos del desarrollador en el App Store.</p>
<h3>10. Funciones que requieren Internet</h3>
<p>El tiempo, el mapa de tráfico, las rutas (ETA) y la previsión de tráfico, la compra/restauración de la suscripción y la primera descarga de paquetes de idioma para la «búsqueda con traducción» del álbum requieren conexión. Solo se envía la información mínima: tus coordenadas a Apple Weather (el nombre de la ciudad se resuelve con Apple Maps), el contenido de mapas solicitado a Apple Maps para el mapa de tráfico, inicio/fin enviados a Apple Maps para calcular ruta y duración (ETA y previsión) y las coordenadas de las fotos a Apple Maps para resolver los nombres de lugares del índice del álbum; sin datos personales identificativos. El resto de funciones (contabilidad, análisis de salud, reconocimiento de voz en el dispositivo cuando se admite y consultas semánticas) funcionan sin conexión.</p>
<h3>11. Fotos del sistema y organización de fotos</h3>
<p>Al organizar tus Fotos del sistema, la app solo lee identificadores de referencia y metadatos (fecha, lugar, tipo) mediante PhotoKit; no copia ni sube tus fotos. Las etiquetas de análisis generadas en el dispositivo (escenas, texto) se guardan solo en la base cifrada local y puedes borrarlas en la app. La app no usa los grupos «Personas y mascotas» ni realiza reconocimiento facial. Para crear el índice de lugares, la app envía las coordenadas de las fotos (nunca las fotos) a Apple Maps para resolver los nombres de lugares; solo el texto del nombre devuelto se guarda en la base cifrada local.</p>
<h3>12. Copia y restauración locales</h3>
<p>«Ajustes → Copia de seguridad» te permite exportar y restaurar tu propio archivo de copia.</p>
<ul>
<li>La copia contiene <strong>únicamente</strong> los datos de negocio de tu base cifrada local: datos financieros, listas de álbumes, preferencias, etc. El índice de búsqueda (incluidos los índices vectoriales generados en el dispositivo a partir de fotos, resúmenes de salud, etc.) reside en una base vectorial independiente y <strong>nunca se incluye en la copia</strong>; se reconstruye en el dispositivo tras la restauración.</li>
<li>La copia <strong>no incluye datos de salud</strong> (ni las muestras leídas de Apple Salud ni el análisis de estrés calculado en el dispositivo). Esos datos siempre los custodia la app Salud de Apple; tras volver a autorizarla en un dispositivo nuevo se vuelven a sincronizar automáticamente, por lo que no es necesario ni conveniente duplicarlos.</li>
<li>La copia <strong>no incluye</strong> los archivos de fotos; tras cambiar de dispositivo puedes volver a seleccionarlos en la fototeca del sistema o reimportarlos.</li>
<li>No podemos ni vamos a subir tus datos a <strong>nuestros</strong> servidores (sin cuenta, sin servidor). La app marca su directorio de base de datos como excluido de la copia de iCloud. Además, una copia automática solo de la base de datos (<strong>sin fotos y sin datos de salud</strong>) se guarda en <strong>tu propio</strong> iCloud Drive mediante los documentos de iCloud, por lo que puede restaurarse aunque elimines o reinstales la app. También puedes exportar una copia manualmente en «Ajustes → Copia de seguridad».</li>
</ul>

I18N["es"].guide=`<h2>Guía de uso de PigPigPlan</h2>
<p class="meta">Todo se ejecuta en tu dispositivo — sin cuenta. Cada sección muestra <strong>Entrada → Salida</strong> y <strong>ejemplos</strong> concretos.</p>
<h3>1. Primer inicio</h3>
<p><strong>Entrada:</strong> nada — solo abre la app.</p>
<ul><li>Abrir la app → se crea automáticamente una base de datos local cifrada (sin registro).</li><li>Después ves la portada con las pestañas: Finanzas, Salud, Álbum, y Herramientas / Personal / Ajustes.</li><li>La portada también muestra siempre: el tiempo (condiciones actuales, previsión, consejos de ropa y UV &mdash; datos de Apple Weather), el mapa de tráfico (menús de radio y actualización automática, ⓘ leyenda de colores, ↗ abrir en Mapas) y ETA y previsión de tráfico (⏱ Definir ETA, 🕘▾ rutas recientes, 📈 previsión por horas de hoy) &mdash; ver la sección 6.</li></ul>
<p><strong>Ejemplos:</strong></p>
<ul><li>Primera instalación en un dispositivo nuevo → base de datos inicializada, portada mostrada.</li><li>Volver a abrir la app más tarde → tus datos anteriores ya están ahí.</li></ul>
<h3>2. Inicio y navegación</h3>
<p><strong>Entrada:</strong> toca una pestaña, la corona 👑 o ⚙️.</p>
<ul><li>Tocar una pestaña → se abre ese módulo.</li><li>Tocar 👑 en la portada → se abre la página de suscripción (Pro).</li><li>Tocar ⚙️ → se abren los Ajustes (idioma, tema, intervalo de actualización, datos).</li></ul>
<p><strong>Ejemplos:</strong></p>
<ul><li>Tocar «Salud» → el panel de salud con tus métricas.</li><li>Tocar ⚙️ → Ajustes → cambiar el idioma a español.</li></ul>
<h3>3. Finanzas</h3>
<p><strong>Entrada:</strong> importe, etiqueta, fecha, nota (escritos o dichos en una frase).</p>
<ul><li>Crear un libro y añadir una transacción → aparece en la lista; los totales y gráficos se actualizan al instante.</li><li>Entrada por voz → toca el micrófono y habla → aparece una tarjeta de confirmación → toca Confirmar para guardar.</li><li>Frase incompleta → la tarjeta de confirmación se abre igualmente, ya rellenada con lo entendido (importe / etiqueta / fecha / nota): completa, corrige y toca Confirmar para guardar. Si no se reconoce ningún importe, la app te pedirá que lo repitas.</li><li>Pago a plazos → di “coche, 30 plazos, 1300 cada uno” → el formulario rellena total 39000 / 30 plazos / 1300 por plazo; al cambiar a 36 plazos, el total pasa a 46800 y se mantienen 1300 por plazo.</li><li>Definir un presupuesto (etiqueta + período + importe) → esa etiqueta muestra una barra «gastado / presupuesto».</li><li>Preguntar en lenguaje natural → resultados filtrados (calculados en el dispositivo).</li><li>Preguntas de plan → pregunta si aún toca pagar una cuota (p. ej. «Todavía pago el móvil en julio») → en los planes a plazos, la tarjeta del plan también muestra N/M pagadas, R cuotas restantes y el importe pendiente; las preguntas normales de gasto siguen consultando transacciones.</li><li>Modo privado → los importes se ocultan como ****** por defecto; toca el botón 👁️ «mostrar / ocultar cifras» de arriba para ver los importes reales (vuelve a tocar para ocultar).</li><li>Gráficos e informes → gráfico circular de la composición de gastos, barras por categoría, línea de tendencia ingresos/gastos, tendencia por categoría, ranking por categoría y comparación periodo a periodo — todo calculado en el dispositivo.</li><li>Consulta por voz → toca el micrófono y haz una pregunta en voz alta (p. ej. «cuánto gasté en restaurantes este mes») → la respuesta se calcula en el dispositivo.</li><li>Varios libros → crear, eliminar y cambiar de libro; cada uno con sus propios totales y gráficos.</li><li>Consulta personalizada → varios libros, palabra clave de resumen/notas, varias etiquetas y periodo, con resultados paginados.</li><li>Gestión de planes → pausar, reanudar, cancelar o marcar como pagado el periodo actual en plazos/suscripciones; cada acción pide confirmación.</li><li>Editar o eliminar tras registrar → cada fila del libro tiene « ✎ Editar » y « 🗑 Eliminar » (en iOS también puedes deslizar a la izquierda para eliminar, o mantener pulsado para el menú « Editar / Eliminar »); un resultado de búsqueda abre su detalle a pantalla completa al tocarlo, donde puedes editarlo o eliminarlo. Borrar siempre pide confirmación.</li></ul>
<p><strong>Ejemplos:</strong></p>
<ul><li>Di «comida 35» → tarjeta pendiente «Gasto 35 · Restaurantes».</li><li>Di «presupuesto supermercado 2000 mensual» → presupuesto mensual de supermercado de 2000.</li><li>Escribe «cuánto gasté en restaurantes este mes» → el total del mes en restaurantes.</li><li>Escribe «Todavía pago el móvil en julio» → la tarjeta del plan muestra la cuota del mes, las cuotas restantes y el importe restante.</li></ul>
<h3>4. Salud</h3>
<p><strong>Entrada:</strong> autoriza los tipos que quieras y luego abre una métrica; la entrada por voz también funciona.</p>
<ul><li>Abrir la pestaña Salud y autorizar tipos → tarjetas de frecuencia cardíaca, VFC, sueño, entrenamientos, temperatura, saturación, pasos, estado de ánimo, etc.</li><li>Hoja de acceso a Salud → activa todos los elementos que quieras compartir y luego <strong>desplázate hasta el final</strong> de la hoja y pulsa «Permitir»: el botón de confirmación está al final de la lista y no se ve sin bajar.</li><li>Abrir Estrés → un índice de estrés calculado a partir de VFC / frecuencia en reposo / sueño, en el dispositivo.</li><li>Toca el micrófono y di un valor → una entrada pendiente que puedes confirmar.</li><li>Frase incompleta → la tarjeta pendiente se abre igualmente, ya rellenada con lo entendido (indicador / valor / hora): completa, corrige y toca Confirmar para guardar. Si no se reconoce nada como registro de salud, la app muestra una frase de ejemplo.</li><li>Consulta por voz / lenguaje natural → pregunta «qué días tuvo más estrés» → se dirige a los datos de estrés / sueño / entrenamiento, calculado en el dispositivo.</li><li>Gráficos de tendencia → tendencia de salud multi-métrica (estrés / VFC / frecuencia en reposo / sueño) y tendencia del estado de ánimo; exporta el informe a Excel.</li><li>Preguntas y respuestas de salud → pregunta «qué tal dormí esta semana» o «qué días tuve más estrés» → respuesta en el dispositivo con tus datos.</li><li>Mis registros → toca cualquier entrada para reabrir su tarjeta de confirmación y corregir el valor / la hora / el tipo de ejercicio, y guarda (la copia escrita en Salud también se actualiza); desliza a la izquierda para eliminar, lo que borra el registro local y su copia en Salud.</li><li>Ejercicio declarado → fecha + tipo de ejercicio + duración + calorías quemadas (opcional) se guardan juntos; las calorías solo se escriben si las dices (nunca se estiman).</li></ul>
<p><strong>Ejemplos:</strong></p>
<ul><li>Autorizar Frecuencia cardíaca y Sueño → la FC en reposo de hoy y el sueño de anoche.</li><li>Di «tensión 120 80» → una entrada pendiente de tensión arterial.</li><li>Di «peso 68» → una entrada pendiente de peso corporal.</li><li>Di “dolor de cabeza y también de hombro” → crea dos borradores a la vez.</li><li>Di “ayer corrí 30 min, 280 calorías” → registra «fecha ayer + tipo correr + 30 min + 280 kcal»; toca esa fila en Mis registros para cambiar el tipo, la duración o las calorías.</li></ul>
<h3>5. Álbum simple</h3>
<p><strong>Entrada:</strong> concede acceso a Fotos y elige fotos con un filtro.</p>
<ul><li>Dentro de un álbum: abajo «Añadir desde Fotos del sistema» → elegir con el selector del sistema; «Añadir fotos» → filtrar Fotos del sistema por Tiempo / Lugar / Tipo y añadir la selección al álbum.</li><li>Conceder acceso → la cuadrícula de Fotos del sistema se vuelve legible.</li><li>Filtrar por Tiempo / Lugar / Tipo / Favoritos / Capturas / Panorámica / Ráfaga / Live → la cuadrícula se reduce a las fotos coincidentes.</li>
<li>La búsqueda de lugares incluye <strong>más de 50.000 ciudades y regiones de todo el mundo</strong> (los 8 idiomas de la app se corresponden, así que funciona el nombre chino y la grafía local); si no encuentras una ciudad, prueba con el <strong>nombre de la ciudad o de la provincia / estado</strong> (p. ej. Guangdong / 广东省, Hawaii). Los nombres que no están en la tabla se consultan una vez más en Apple Maps; si tampoco aparece, se conserva la palabra original — la app nunca adivina.</li><li>Los nombres de lugares del índice de lugares se generan mediante la geocodificación inversa de Apple Maps a partir de las coordenadas. Debido a las limitaciones de los datos de Apple Maps, algunos lugares de China pueden seguir devolviéndose en chino aunque la app esté en francés u otro idioma que no sea chino (esto no significa que el ajuste de idioma de la app no funcione). Si ocurre, prueba con un nombre en inglés en «Lugar (opcional)» o escribe directamente el nombre de la ciudad (p. ej. Guangzhou / 广州市) y vuelve a buscar.</li><li>Seleccionar fotos → crear un álbum, reordenar, iniciar una presentación o exportar el álbum a MP4 desde la propia presentación.</li><li>Solo se leen referencias y metadatos de las fotos — las fotos nunca se copian ni se suben.</li><li>Voz en álbum → en la pantalla «Buscar fotos», mantén pulsado el botón de voz y di condiciones (p. ej. «fotos de Tokio de agosto de 2024», «solo capturas», «vídeos de los últimos 30 días») → la cuadrícula se reduce y las fotos encontradas quedan seleccionadas; toca «Crear álbum». Di «que se llama Playa» para poner nombre (si no, se nombra según las condiciones). El reconocimiento de voz es solo en el dispositivo.</li><li>Buscar duplicados → en un álbum toca «Buscar duplicados»: se analizan y agrupan las fotos similares, marca las sobrantes (mantén pulsado para ampliar) y toca «Eliminar seleccionadas» — los duplicados se limpian de una vez; las fotos del sistema van a «Eliminados recientemente» y se pueden recuperar.</li></ul>
<p><strong>Ejemplos:</strong></p>
<ul><li>Filtrar «Capturas» → solo se listan las capturas.</li><li>Seleccionar 20 fotos → Crear álbum → reproducir la presentación → toca 🎞 (Exportar MP4) → un vídeo de presentación guardado en tu dispositivo.</li><li>Álbum → Buscar duplicados → marca las sobrantes → Eliminar seleccionadas → duplicados fuera (las fotos del sistema se recuperan desde «Eliminados recientemente»).</li><li>La app está en francés pero un lugar sigue apareciendo en chino → escribe Guangzhou o 广州市 en «Lugar (opcional)» → toca «Buscar».</li><li>Un pueblo pequeño no devuelve nada → escribe la provincia / el estado (p. ej. Guangdong, Hawaii) → se muestran las fotos de esa región.</li></ul>
<h3>6. Clima e itinerario (tráfico)</h3>
<p><strong>Entrada:</strong> abre Clima (usa tu ubicación); para una ruta, define origen, destino y modo de transporte.</p>
<ul><li>Abrir Clima → condiciones actuales y previsión (datos de Apple Weather; tus coordenadas se envían al consultar).</li><li>El clima se actualiza automáticamente → pasadas 3 horas, al volver al primer plano o mientras permaneces en la portada (en segundo plano no se actualiza); ↻ actualiza manualmente: el mapa de tráfico se redibuja al instante y el clima reutiliza la caché durante 1 hora.</li><li>El mapa de la portada → el tráfico cercano con los colores de Apple Maps; los dos menús ajustan el radio y la frecuencia de actualización, ⓘ explica los colores y ↗ abre el punto en Apple Maps. En cuanto defines un ETA, ese mismo mapa pasa a mostrar tu ruta (la opción actual en magenta y las alternativas en azul oscuro).</li><li>Definir ETA → origen y destino (buscar una dirección o usar la ubicación actual) + modo (coche / caminar / bicicleta) → la portada muestra «16 min · 3,2 km» y la ruta en el mapa (calculados por Apple Maps), el veredicto Fluido / Moderado / Denso, una estimación «en 30 minutos» y chips con las alternativas; toca otro chip para cambiar de ruta.</li><li>Fila de ETA → ⇅ intercambia origen y destino y bloquea el sentido, 🕘▾ lista las rutas recientes, ✎ edita, ↗ abre en Apple Maps; las rutas favoritas se guardan para reutilizarlas. Al acercarte al destino la ruta se invierte sola y aparece la etiqueta «invertida».</li><li>Predicción de tráfico (📈) → el tiempo de viaje hora a hora de una ruta a lo largo del día, las franjas Fluido / Moderado / Denso con su tiempo medio, un gráfico y el detalle por hora; exportable a Excel. Funciona sin definir un ETA (elige un favorito o una ruta personalizada). Los tiempos mostrados se incrementan ligeramente porque Apple Maps suele ser optimista. En una ruta personalizada, el origen y el destino pueden fijarse directamente con «Ubicación actual».</li><li>Consejos de portada → sugerencia de ropa, recordatorios de detalles, aviso UV (pico antes del atardecer) y alerta meteorológica, calculados en el dispositivo.</li> <p><strong>Ejemplos:</strong></p>

/* URL 参数：?lang=en / ?tab=guide（App 打开隐私政策时会按当前语言带上 lang，网页直接切到该语言） */
function param(k){var m=new RegExp("[?&]"+k+"=([^&#]*)").exec(location.search||"");return m?decodeURIComponent(m[1].replace(/\+/g," ")):null}
// 语言码归一：zh-Hans / zh-Hans-CN / zh-CN → zh-Hans；zh-TW / zh-Hant → zh-Hant；en-US → en
function normLang(q){
  if(!q)return null;
  if(I18N[q])return q;
  var s=String(q).toLowerCase();
  if(s.indexOf("zh")===0){
    if(s.indexOf("hant")>=0||s.indexOf("tw")>=0||s.indexOf("hk")>=0||s.indexOf("mo")>=0)return "zh-Hant";
    return "zh-Hans";
  }
  var base=s.split("-")[0];
  return I18N[base]?base:null;
}

function syncURL(){try{history.replaceState(null,"","?lang="+encodeURIComponent(cur)+(tab==="privacy"?"":"&tab="+tab))}catch(e){}}
function el(id){return document.getElementById(id)}
// 内容回到顶部（头部固定，只有 #scroll 在滚）
function resetScroll(){var s=el("scroll");if(s)s.scrollTop=0}
/* 功能截图：路径固定为 screenshots/<语言>/<模块>-<视图>.jpg；封面单独一张 screenshots/<语言>/cover.jpg
   模块：finance / health / album；视图：home / home-2 / entry / entry-2 / query / query-2（财务有 home-2 / entry-2 / query-2，健康有 entry-2 / query-2）
   封面：插在「1. 首次启动」小节；该语言目录没有 cover.jpg 时自动回退 screenshots/cover.jpg（通用单图）
   截图未放好时由 onerror 显示预留路径，放好同名 JPG 即自动出现。 */
var SHOT_COPY={
  "en":{cover:"Cover",finance:"Finance",health:"Health",album:"Album",home:"Home",home2:"Home 2",entry:"Add / entry",entry2:"Add / entry 2",query:"Search / results",query2:"Search / results 2"},
  "zh-Hans":{cover:"封面",finance:"财务",health:"健康",album:"相册",home:"主页",home2:"主页 2",entry:"录入",entry2:"录入 2",query:"查询",query2:"查询 2"},
  "zh-Hant":{cover:"封面",finance:"財務",health:"健康",album:"相簿",home:"主頁",home2:"主頁 2",entry:"錄入",entry2:"錄入 2",query:"查詢",query2:"查詢 2"},
  "ja":{cover:"カバー",finance:"家計",health:"健康",album:"アルバム",home:"ホーム",home2:"ホーム 2",entry:"入力",entry2:"入力 2",query:"検索",query2:"検索 2"},
  "ko":{cover:"커버",finance:"가계부",health:"건강",album:"앨범",home:"홈",home2:"홈 2",entry:"입력",entry2:"입력 2",query:"조회",query2:"조회 2"},
  "de":{cover:"Startseite",finance:"Finanzen",health:"Gesundheit",album:"Album",home:"Start",home2:"Start 2",entry:"Eingabe",entry2:"Eingabe 2",query:"Abfrage",query2:"Abfrage 2"},
  "fr":{cover:"Accueil",finance:"Finances",health:"Santé",album:"Album",home:"Accueil",home2:"Accueil 2",entry:"Saisie",entry2:"Saisie 2",query:"Recherche",query2:"Recherche 2"},
  "es":{cover:"Portada",finance:"Finanzas",health:"Salud",album:"Álbum",home:"Inicio",home2:"Inicio 2",entry:"Entrada",entry2:"Entrada 2",query:"Consulta",query2:"Consulta 2"}
};
function addGuideShots(lang){
  var host=el("doc");if(!host)return;
  var copy=SHOT_COPY[lang]||SHOT_COPY["en"];
  var sections={"1":"cover","3":"finance","4":"health","5":"album"};
  var viewsByModule={cover:["cover"],finance:["home","home-2","entry","entry-2","query","query-2"],health:["home","entry","entry-2","query","query-2"],album:["home","entry","query"]};
  Array.prototype.forEach.call(host.querySelectorAll("h3"),function(h){
    var m=/^\s*([0-9]+)\./.exec(h.textContent||"");if(!m)return;
    var key=sections[m[1]];if(!key)return;
    var views=viewsByModule[key];
    var anchor=h.nextElementSibling;
    if(anchor&&anchor.classList&&anchor.classList.contains("shots"))return;
    var isCover=(key==="cover");
    var wrap=document.createElement("div");
    wrap.className="shots";
    wrap.setAttribute("data-shots",key);
    wrap.setAttribute("role","group");
    wrap.setAttribute("aria-label",copy[key]);
    wrap.innerHTML=views.map(function(view){
      // 封面只有一张：screenshots/<lang>/cover.jpg；该语言目录没放图时回退到通用的 screenshots/cover.jpg
      var base=isCover?("screenshots/"+lang+"/cover.jpg"):("screenshots/"+lang+"/"+key+"-"+view+".jpg");
      var labelKey=(view==="entry-2")?"entry2":(view==="query-2")?"query2":(view==="home-2")?"home2":view;
      // 相册的 entry 截图实际也是「找照片」查询界面，文案统一显示为「查询」，避免误导
      if(key==="album"&&view==="entry")labelKey="query";
      var caption=isCover?copy.cover:(copy[key]+" · "+copy[labelKey]);
      var onerr=isCover
        ? "if(this.dataset.fb){this.parentNode.classList.add(\'missing\')}else{this.dataset.fb=\'1\';this.src=\'screenshots/cover.jpg\'}"
        : "this.parentNode.classList.add(\'missing\')";
      return '<figure class="shot"><img src="'+base+'" alt="'+caption+'" loading="lazy" decoding="async" onerror="'+onerr+'"><div class="shot-missing">'+base+'</div><figcaption>'+caption+'</figcaption></figure>';
    }).join("");
    // 截图放在该小节第一段 / 第一个列表之后，避免把标题和正文挤开
    if(anchor&&(anchor.tagName==="P"||anchor.tagName==="UL"))anchor.parentNode.insertBefore(wrap,anchor.nextSibling);
    else h.parentNode.insertBefore(wrap,h.nextSibling);
  });
}
function draw(){
  document.documentElement.lang=cur;
  var d=I18N[cur]||I18N["en"];
  // 语言下拉：首次渲染填 8 个 option，之后只同步 value（不重建 → 不丢焦点）
  var sel=el("langSel");
  if(sel){
    if(!sel.options.length){
      sel.innerHTML=LANGS.map(function(l){return '<option value="'+l[0]+'">'+l[1]+'</option>'}).join("");
      sel.onchange=function(){cur=sel.value;syncURL();resetScroll();draw()};
    }
    sel.value=cur;
    sel.setAttribute("aria-label",d.ui.lang||"Language");
    sel.title=d.ui.lang||"Language";
  }
  // 三个页签：固定在头部，等分一行（role=tab + aria-selected + 方向键，供读屏 / 键盘）
  function tabBtn(t,label){
    var on=(tab===t);
    return '<button class="tab'+(on?" active":"")+'" id="tab-'+t+'" data-t="'+t+'" role="tab" aria-selected="'+on+'" aria-controls="doc" tabindex="'+(on?0:-1)+'">'+label+'</button>';
  }
  el("tabs").innerHTML=tabBtn("privacy",d.ui.privacy)+tabBtn("guide",d.ui.guide)+tabBtn("terms",d.ui.terms);
  el("doc").innerHTML=(tab==="privacy")?d.privacy:(tab==="guide")?d.guide:(d.terms||I18N["en"].terms);
  if(tab==="guide")addGuideShots(cur);
  el("doc").setAttribute("aria-labelledby","tab-"+tab);
  if(d.contact){el("footContact").textContent=d.contact}
  el("footSources").innerHTML=d.sources||I18N["en"].sources;
  // 切页签：写 URL → 内容回顶 → 重绘；键盘触发时把焦点交还新页签
  function selectTab(t,focus){
    if(tab===t){resetScroll();return}
    tab=t;syncURL();resetScroll();draw();
    if(focus){var nb=document.querySelector('.tab[data-t="'+t+'"]');if(nb){try{nb.focus({preventScroll:true})}catch(e){nb.focus()}}}
  }
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){
    b.onclick=function(){selectTab(b.getAttribute("data-t"),true)};
    b.onkeydown=function(e){
      var k=e.key,list=Array.prototype.slice.call(document.querySelectorAll(".tab")),
          i=list.indexOf(b),n=list.length,j=-1;
      if(k==="ArrowRight")j=(i+1)%n;
      else if(k==="ArrowLeft")j=(i-1+n)%n;
      else if(k==="Home")j=0;
      else if(k==="End")j=n-1;
      if(j<0)return;
      e.preventDefault();
      selectTab(list[j].getAttribute("data-t"),true);
    };
  });
  syncURL();
}
window.addEventListener("DOMContentLoaded",draw);
</script>
</body>
</html>
