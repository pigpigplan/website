<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>PigPigPlan — Privacy Policy &amp; User Guide</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--muted:#6b7280;--line:#e5e7eb;--brand:#0a84ff;--card:#f7f8fa;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0d;--fg:#e8e8ea;--muted:#9ca3af;--line:#2a2a2e;--card:#17171a;--brand:#3b9dff}}
*{box-sizing:border-box}
html,body{height:100%}
/* 应用外壳：整页不滚动，只有 <main id="scroll"> 滚动
   → 头部（品牌 + 语言下拉 + 三个页签）永远钉在顶部，切换页签时不再跟着滚走 */
body{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans",sans-serif;background:var(--bg);color:var(--fg)}
header{flex:0 0 auto;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:14px 18px}
.brand{font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{height:30px;width:auto;display:block;flex:0 0 auto}
.brand .name{white-space:nowrap}
/* 语言下拉：紧跟在 PigPigPlan 文字后面（原生 select，iOS 上直接弹系统选择器） */
.langsel{font:inherit;font-size:14px;font-weight:500;cursor:pointer;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:46vw;margin-left:2px}
/* JS 未执行时（禁用 JS / 只抓 HTML 的爬虫）不显示空控件 */
.langsel:empty{display:none}
.tab{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 10px;border-radius:999px;font-size:15px;text-align:center;line-height:1.25;min-height:40px;white-space:normal;overflow-wrap:anywhere;hyphens:auto}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
/* 三个页签等分一行：任何语言（含「使用条款与免责声明」）都不会把头部挤溢出 */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 0}
.tabs:empty{display:none}
/* 超窄屏（320–380）压缩页签字号/内边距，避免头部吃掉太多内容高度 */
@media(max-width:380px){.tab{font-size:13px;padding:7px 6px;min-height:36px}.brand{gap:8px}.langsel{font-size:13px;padding:5px 8px}}
main{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
main .wrap{padding-top:6px;padding-bottom:40px}
h2{font-size:22px;margin:1.2em 0 .4em}
h3{font-size:17px;margin:1.4em 0 .3em}
.meta{color:var(--muted);font-size:13px}
.callout{background:var(--card);border-left:4px solid var(--brand);padding:12px 14px;border-radius:8px;margin:14px 0}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--card)}
ul{padding-left:20px}
li{margin:.3em 0}
a{color:var(--brand)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:18px;text-align:center}
/* 功能截图：财务/健康各 5 张（主页 / 录入 / 录入 2 / 查询 / 查询 2），相册 3 张；缺图时显示预留路径，补图后自动替换 */
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0 18px;align-items:start}
@media(max-width:640px){.shots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.shots{grid-template-columns:1fr}}
.shot{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);break-inside:avoid}
.shot img{display:block;width:100%;height:auto;background:var(--card)}
.shot figcaption{font-size:12px;line-height:1.45;color:var(--muted);padding:7px 9px;border-top:1px solid var(--line)}
.shot .shot-missing{display:none;min-height:220px;padding:12px;align-items:center;justify-content:center;text-align:center;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(127,127,127,.06) 8px 16px)}
.shot.missing img{display:none}
.shot.missing .shot-missing{display:flex}
.shots[data-shots="cover"]{grid-template-columns:minmax(0,min(260px,100%))}
@media print{html,body{height:auto;overflow:visible}body{display:block;font-size:12pt}header{position:static}.tabs{display:none}main{overflow:visible}.shots{grid-template-columns:repeat(3,1fr)}}
</style>

I18N["en"].privacy=`<h2>PigPigPlan Privacy Policy</h2>
<p class="meta">Effective Date: October 2026 · Platforms: iOS / iPadOS / macOS · Version: v1.0</p>
<div class="callout"><strong>Core commitment.</strong> PigPigPlan is a privacy-first, local-first finance &amp; personal data app. All data you create (including health data) stays on your device and is never uploaded to any server; exports are always initiated by you. The built-in AI (voice cleanup, natural-language queries, health Q&amp;A, semantic search) runs entirely on-device on a small model bundled with the app (~0.8B parameters) and needs no internet; speech-to-text is performed on-device whenever supported, and recognised text is parsed only locally and never uploaded to our servers.</div>
<h3>1. What Data We Handle</h3>
<p>All data is entered by you or read after your explicit authorization on your device:</p>
<table><tr><th>Category</th><th>Content</th><th>Source</th></tr>
<tr><td>Finance</td><td>Ledgers, transactions, tags, budgets, installment plans</td><td>Your input</td></tr>
<tr><td>Health</td><td>Heart rate, HRV, resting heart rate, sleep, respiratory rate, blood oxygen, body temperature, steps, workouts, mood, menstrual cycle, sun exposure</td><td>Apple Health (HealthKit), authorized per item by you</td></tr>
<tr><td>Content</td><td>Simple Album photos (incl. references to System Photos)</td><td>Your import / capture / authorized System Photos access</td></tr>
<tr><td>Preferences</td><td>Language, theme, health refresh interval, etc.</td><td>Generated locally</td></tr></table>
<p>We do <strong>NOT</strong> collect: name, email, phone number, contacts, location, advertising identifiers (IDFA), or device identifiers used for tracking.</p>
<h3>2. Storage &amp; Processing</h3>
<ul>
<li><strong>100% local storage</strong>: data is encrypted in a local database (SQLCipher, AES-256).</li>
<li><strong>On-device AI</strong>: AI features (natural-language queries, voice notes, health Q&amp;A, semantic search) run on a small built-in model (~0.8B parameters) entirely on your device. No internet connection, Apple Intelligence or third-party cloud is involved, and your queries never leave the device.</li>
<li><strong>Voice, maps &amp; health boundaries</strong>: speech-to-text runs on-device whenever the device supports it, and album voice commands always require on-device recognition. When the device or language does not support it, Apple’s speech recognition service handles the audio (internet required), and the recognised text is parsed only on-device — never uploaded to our servers. Only weather, the traffic map, routing (ETA) and traffic forecast, plus the album place index, send anything to Apple: coordinates to Apple Weather (city names resolved via Apple Maps); the traffic map is drawn by Apple Maps; start/end points go to Apple Maps to compute ETA and traffic forecast (the forecast asks Apple Maps for an estimated travel time per time slot of the day); photo coordinates go to Apple Maps to resolve place names — photos themselves are never uploaded. Start/end points, favourite routes and recent routes you set on the cover are kept only in local preferences on your device and never uploaded. Health data is read only after your authorisation; health records you enter manually (including voice-confirmed ones) are written back to Apple Health (HealthKit) only after your authorisation.</li>
<li><strong>No server, no account</strong>: we operate no servers receiving your data; no sign-up required; no advertising, analytics, or third-party tracking SDKs. (Automatic backups are stored in <strong>your own</strong> iCloud Drive, not on our servers.)</li>
<li><strong>Purpose</strong>: data is used only for features you personally use — bookkeeping, health stress analysis, semantic search, photo management.</li>
</ul>
<h3>3. HealthKit Disclosure</h3>
<p>PigPigPlan reads health data via Apple HealthKit for <strong>stress analysis</strong> (based on HRV, resting heart rate, sleep, etc.) and health trend display.</p>
<ul>
<li><strong>Authorization</strong>: the system asks you to authorize each data type individually;</li>
<li><strong>Scope</strong>: health data is processed locally, only for the purposes above;</li>
<li><strong>Prohibited</strong>: we do <strong>not</strong> use it for advertising, sell it, or disclose it to any third party;</li>
<li><strong>Write access</strong>: health records you enter manually in the app (including voice-confirmed entries) are written back to Apple Health (HealthKit) only after your authorisation and only for the types you allow; revoking access stops further writes.</li>
<li><strong>Revocation</strong>: disable authorization in the Health app (&ldquo;Data Access &amp; Devices&rdquo;) or delete the app to stop all access immediately.</li>
</ul>
<h3>4. Export</h3>
<p>You fully control your data. <strong>Export is always initiated by you</strong>:</p>
<ul>
<li>Export <strong>your own data</strong> to Excel (.xlsx) or files on your device or iCloud Drive;</li>
<li>Exportable data: <strong>finance records, health analysis results, album photos</strong>;</li>
<li>Export is for your personal backup, migration, or analysis only and is <strong>never automatically sent to third parties</strong>;</li>
<li><strong>This app offers no third-party API access to your data.</strong></li>
</ul>
<h3>5. Data Security</h3>
<ul>
<li>Database encrypted locally with <strong>SQLCipher</strong> (AES-256);</li>
<li>Health data processed within Apple&rsquo;s system security containers;</li>
<li>Device lock and OS security protect your data.</li>
</ul>
<h3>6. Data Retention &amp; Deletion</h3>
<table><tr><th>Action</th><th>Result</th></tr>
<tr><td>Delete a record</td><td>Removed immediately from the local database</td></tr>
<tr><td>Delete a ledger / album</td><td>Its data is removed together</td></tr>
<tr><td>Delete the app</td><td>Local data is removed with it (export first to keep). The automatic backup copy is kept in your own iCloud Drive (Files → iCloud Drive → PigPigPlan) and survives deleting the app; to erase it too, delete that folder in the Files app.</td></tr>
<tr><td>Disable Health authorization</td><td>The app stops reading that health type immediately</td></tr></table>
<h3>7. Children&rsquo;s Privacy</h3>
<p>This app is not directed to children under 13 and does not knowingly collect their personal information.</p>
<h3>8. Third-Party Services</h3>
<p>No third-party advertising, analytics, or tracking services are integrated. The only dependencies are Apple HealthKit / SwiftUI / MLX / WeatherKit (Apple frameworks) and local open-source libraries (SQLite, etc.), used solely for on-device processing.</p>
<h3>9. Policy Changes &amp; Contact</h3>
<p>If this policy changes, we will update this page and mark the effective date; changes never retroactively process historical data. For questions, contact us via the in-app &ldquo;About&rdquo; page or the App Store developer contact.</p>
<h3>10. Features That Require Internet</h3>
<p>Weather, the traffic map, routing (ETA) and traffic forecast, subscription purchase/restore, and the first download of language packs for the album’s “translation-enhanced search” require internet. Only the minimum necessary information is sent — coordinates to Apple Weather (the city name is resolved through Apple Maps), map content requested from Apple Maps for the traffic map, start/end points to Apple Maps to compute routes and travel times for ETA and traffic forecast, and photo coordinates to Apple Maps to resolve place names for the album place index — with no personal identifiers. Everything else (bookkeeping, health analysis, on-device speech recognition when supported, semantic queries) works offline.</p>
<h3>11. System Photos &amp; Photo Organizing</h3>
<p>When organizing System Photos, the app only reads photo reference identifiers and metadata (capture time, location, type) via PhotoKit; it does not copy or upload photos. On-device analysis labels (scenes, text) are stored only in the local encrypted database and can be cleared in-app anytime. The app does not use &ldquo;People &amp; Pets&rdquo; face grouping and performs no face recognition. When building the place index, the app sends photo coordinates (never the photos) to Apple Maps to resolve place names; only the returned place-name text is stored in the local encrypted database.</p>
<h3>12. Local Backup &amp; Restore</h3>
<p>“Settings → Backup” lets you export and restore your own backup file.</p>
<ul>
<li>The backup <strong>only</strong> contains the business data in your local encrypted database: finance data, album lists, preferences, etc. The search index (including vector indexes generated on-device from photos, health summaries, etc.) lives in a separate vector database and is <strong>never included in the backup</strong>; it is rebuilt on-device after restore.</li>
<li>The backup <strong>does not include health data</strong> (neither samples read from Apple Health nor the stress analysis computed on device). That data is always held by Apple’s Health app; after you re-authorise on a new device it syncs again automatically, so it neither needs nor should be duplicated.</li>
<li>The backup <strong>does not include</strong> photo files; after switching devices you can re-select them from the system photo library or re-import them.</li>
<li>We cannot and do not upload your data to <strong>our</strong> servers (no account, no server). The app marks its database directory as excluded from iCloud backup. In addition, an automatic backup copy of the database (<strong>without photos and without health data</strong>) is saved to <strong>your own</strong> iCloud Drive through iCloud Documents, so it can be restored even after deleting or reinstalling the app. You can also export a backup manually under “Settings → Backup”.</li>
</ul>
`;
I18N["en"].guide=`<h2>PigPigPlan User Guide</h2>
<p class="meta">Everything runs on your device — no account required. Each section shows <strong>Input → Output</strong> and worked <strong>Examples</strong>.</p>
<h3>1. First Launch</h3>
<p><strong>Input:</strong> nothing — just open the app.</p>
<ul><li>Open the app → a local encrypted database is created automatically (no registration).</li><li>You then see the cover page with the tabs: Finance, Health, Albums, plus Tools / Personal / Settings.</li><li>The cover also always shows: weather (current conditions, forecast, outfit and UV advice &mdash; data from Apple Weather), the traffic map (radius and auto-refresh menus, &#x24D8; colour legend, &#x2197; open in Maps) and ETA &amp; traffic forecast (&#x23F1; Set ETA, &#x1F558;&#x25BE; recent routes, &#x1F4C8; hourly forecast for today) &mdash; see Section 6.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>First install on a new device → database initialized, cover page shown.</li><li>Re-open the app later → your previous data is already there.</li></ul>
<h3>2. Home &amp; Navigation</h3>
<p><strong>Input:</strong> tap a tab, the 👑 crown, or ⚙️.</p>
<ul><li>Tap a tab → that module opens.</li><li>Tap 👑 on the cover → the subscription (Pro) page opens.</li><li>Tap ⚙️ → Settings opens (language, theme, refresh interval, data).</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Tap “Health” → the health dashboard with your metrics.</li><li>Tap ⚙️ → Settings → change language to English.</li></ul>
<h3>3. Finance</h3>
<p><strong>Input:</strong> amount, tag, date, note (type them or speak one sentence).</p>
<ul><li>Create a ledger and add a transaction → it appears in the list; totals and charts update instantly.</li><li>Voice entry → tap the mic and speak → a confirmation card appears → tap Confirm to save.</li><li>Incomplete sentence → the confirmation card still opens pre-filled with what was understood (amount / tag / date / note); fill in the gaps, fix anything wrong, then tap Confirm to save. If no amount is recognised at all, the app asks you to say it again.</li><li>Installment entry → say “a car, 30 payments, 1300 each” (or “1300 per period”) → the card pre-fills total 39000 / 30 periods / 1300 per period; changing periods to 36 updates the total to 46800 while keeping 1300 per period.</li><li>Set a budget (tag + period + amount) → that tag shows a “spent / budget” progress bar.</li><li>Ask in natural language → get filtered results (computed on-device).</li><li>Plan questions → ask whether a payment is still due (for example “Do I still owe the phone in July”) → for installment plans, the card also shows paid N/M, R payments left and the remaining amount still due; generic questions such as “how much did I spend this month” still query transactions.</li><li>Privacy mode → amounts are hidden as ****** by default; tap the 👁️ “show / hide numbers” button at the top to reveal the real amounts (tap again to hide).</li><li>Charts &amp; reports → expense-composition pie, category bar chart, income/expense trend line, category spending trend, category ranking and period-over-period comparison — all computed on-device.</li><li>Voice query → tap the mic and ask a question out loud (e.g. “how much did I spend on dining this month”) → the answer is computed on-device.</li><li>Multiple ledgers → create, delete or switch ledgers; each one keeps its own totals and charts.</li><li>Custom query → combine several ledgers, a summary/note keyword, multiple tags and a date range, with paged results.</li><li>Plan management → pause, resume, cancel or mark the current period as paid for installments/subscriptions; each action asks for confirmation first.</li><li>Edit or delete after entry → every row in the ledger list has ✎ Edit and 🗑 Delete buttons (on iOS you can also swipe a row left to delete, or long-press for an Edit / Delete menu); a search result opens its full-screen detail when tapped, where you can edit or delete it. Deletions always ask for confirmation first.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Say “Lunch 35” → a pending card “Expense 35 · Dining”.</li><li>Say “Budget Groceries 2000 monthly” → a monthly Groceries budget of 2000.</li><li>Type “how much did I spend on dining this month” → this month’s dining total.</li><li>Type “Do I still owe the phone in July” → the plan card shows that month’s due amount, payments left and remaining amount.</li></ul>
<h3>4. Health</h3>
<p><strong>Input:</strong> authorize the health types you want, then open a metric; voice entry also works.</p>
<ul><li>Open the Health tab and authorize types → cards for heart rate, HRV, sleep, workouts, body temperature, blood oxygen, steps, mood, and more.</li><li>Health access sheet → switch on every item you want to share, then <strong>scroll to the very bottom</strong> of the sheet and tap Allow: the confirm button sits at the end of the list, so the authorisation only takes effect after you confirm there.</li><li>Open Stress → a stress readout computed from HRV / resting heart rate / sleep, on-device.</li><li>Tap the mic and say a value → a pending entry you can confirm.</li><li>Incomplete sentence → the pending card still opens pre-filled with what was understood (metric / value / time); fill in the gaps, fix anything wrong, then tap Confirm to save. If nothing is recognised as a health record, the app suggests an example sentence.</li><li>Voice / natural-language query → ask “which days had the highest stress” → routed to the stress / sleep / workout data and computed on-device.</li><li>Trend charts → a multi-metric health trend (stress / HRV / resting heart rate / sleep) and an emotion trend chart; export the trend report to Excel.</li><li>Health Q&amp;A → ask “how was my sleep this week” or “which days had the highest stress” → answered on-device from your health data.</li><li>My Records → tap any entry to reopen its confirmation card and fix the value / time / workout type, then save (the copy written back to Apple Health is updated too); swipe left to delete, which removes both the local entry and its Health copy.</li><li>Self-reported workout → date + workout type + duration + optional energy burned are saved together; calories are written only when you actually say them (never estimated).</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Grant Heart Rate &amp; Sleep → today’s resting HR and last night’s sleep.</li><li>Say “Blood pressure 120 80” → a pending blood-pressure entry.</li><li>Say “Weight 68” → a pending body-weight entry.</li><li>Say “headache, and my shoulder hurts too” → creates two separate draft entries at once.</li><li>Say “ran 30 min yesterday, burned 280 calories” → records date (yesterday) + type (running) + duration (30 min) + energy burned (280 kcal); tap that row in My Records to change the type, duration or calories.</li></ul>
<h3>5. Simple Album</h3>
<p><strong>Input:</strong> grant photo access, then pick photos with a filter.</p>
<ul><li>In an album: tap <strong>Add from System Photos</strong> at the bottom to pick photos with the system picker; tap <strong>Add Photos</strong> to browse System Photos and filter by Time / Place / Type before adding the selected ones into the album.</li><li>Grant access → the System Photos grid is readable.</li><li>Filter by Time / Place / Type / Favorites / Screenshots / Panorama / Burst / Live → the grid narrows to matching photos.</li>
<li>Place search covers <strong>over 50,000 cities and regions worldwide</strong> (the 8 app languages match each other, so both the Chinese and the local spelling work); if a city isn’t found, try the <strong>city or province / state name</strong> instead (e.g. Guangdong / 广东省, Hawaii). Names missing from the table get one more look-up in Apple Maps; if that fails the original word is kept — the app never guesses.</li><li>Place names in the place index are generated by Apple Maps reverse geocoding. Due to Apple Maps data limitations, some places in China may still be returned in Chinese even when the app language is French or another non-Chinese language (this does not mean the app language setting failed). If this happens, try an English name in “Location (optional)”, or enter the city name directly (e.g. Guangzhou / 广州市) and search again.</li><li>Select photos → create an album, reorder, play a slideshow — or export the album as MP4 from inside the slideshow.</li><li>Only photo references and metadata are read — photos are never copied or uploaded.</li><li>Album voice → on the “Find Photos” screen, hold to talk and say conditions (e.g. “Tokyo photos from August 2024”, “only screenshots”, “videos from the last 30 days”) → the grid narrows and pre-selects the matches, then tap “Create Album”; say “called Beach” to name the album (otherwise it is named after the conditions). Speech is recognised on-device only.</li><li>Find duplicates → in an album tap “Find Duplicates”: similar shots are scanned and grouped, tick the extras (long-press for a larger view) and tap “Delete Selected” — duplicates are cleared in one go, and system photos go to Recently Deleted so they can still be restored.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Filter “Screenshots” → only screenshots are listed.</li><li>Select 20 photos → Create Album → play the slideshow → tap the 🎞 button (Export MP4) → a slideshow video saved to your device.</li><li>Album → Find Duplicates → tick the extras → Delete Selected → the duplicates are gone (system photos can be restored from Recently Deleted).</li><li>App language is French but a place still appears in Chinese → enter Guangzhou or 广州市 in “Location (optional)” → tap “Search”.</li><li>A small town returns nothing → enter the province / state instead (e.g. Guangdong, Hawaii) → the grid shows that region’s photos.</li></ul>
<h3>6. Weather &amp; Routes (Traffic)</h3>
<p><strong>Input:</strong> open Weather (uses your location); for a route, set start, end, and transport mode.</p>
<ul><li>Open Weather → current conditions and the forecast (data from Apple Weather; your coordinates are sent when fetching).</li><li>Weather auto-updates → after 3 hours it refreshes on returning to the foreground or while you stay on the cover (nothing refreshes in the background); tap ↻ to refresh manually — the traffic map redraws at once, while weather reuses the cache within 1 hour.</li><li>Cover map → nearby traffic in Apple Maps colors; two menus set the radius and the refresh interval, ⓘ explains the colors, ↗ opens it in Apple Maps. With an ETA set, the same map shows your route (current plan magenta, alternatives dark blue).</li><li>Set ETA → start and end (search an address or use your location) + mode (car / walk / cycle) → the cover shows “16 min · 3.2 km” and the route on the map (computed by Apple Maps), a Light / Moderate / Heavy verdict, an “in 30 minutes” estimate and alternative-route chips; tap a chip to switch.</li><li>ETA row → ⇅ swaps start and end (and locks the direction), 🕘 ▾ lists your recent routes, ✎ edits, ↗ opens in Apple Maps; favourite routes are kept for reuse. Near the destination the route reverses itself and shows a “reversed” badge.</li><li>Traffic forecast (📈) → a route’s hourly travel time across the day, the light / moderate / heavy windows with average times, a chart plus hourly detail, exportable to Excel; works without an ETA (pick a saved or custom route). Times are raised slightly because Apple Maps tends to be optimistic; for a custom route the origin/destination can be set straight from Current location.</li><li>Cover advice → outfit suggestion, detail reminders, a UV warning (peak before sunset) and a weather alert, all computed on-device from the forecast.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Open Weather → today’s temperature and the 7-day forecast.</li><li>Stay on the cover for over 3 hours, or come back after 3 hours in the background → the weather updates automatically, without tapping ↻.</li><li>Set Home → Office, mode “driving” → distance, duration, and the route on the map.</li><li>Switch mode to “walking” → the ETA updates for walking.</li><li>Open Traffic forecast → the morning and evening peaks are the slowest; pick a later departure → the ETA drops.</li><li>Tap 📈 without setting an ETA → choose “Custom route” → forecast today hour by hour → export it to Excel.</li><li>Tap another duration chip → the map switches to the alternative route.</li><li>Walk back towards the office in the evening → the route flips to Office → Home by itself.</li></ul>
<h3>7. Search</h3>
<p><strong>Input:</strong> a keyword, a question, or a voice command — each module searches only its own data.</p>
<ul><li>Finance → ask in natural language (“how much on dining this month”), run a custom query (ledgers + keyword + tags + date range), or give a plan command (pause / resume / cancel / mark this period paid → confirmation card first).</li><li>Health → ask about your own health data (“which days had the highest stress”, “how was my sleep this week”) → answered on-device.</li><li>Album → filter by time / place / type, or use voice commands; place names can also be matched in English through Apple Translation (the language pack is downloaded once).</li><li>Everything is parsed and computed on-device; no query or result is uploaded.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Type “transport last month” → matching finance entries with totals.</li><li>Ask “how was my sleep this week” → a health answer from your sleep data.</li><li>Say “photos from Seoul last year” → the album grid narrows to those photos.</li></ul>
<h3>8. Subscription (Pro)</h3>
<p><strong>Input:</strong> tap a plan (monthly / yearly), “Restore Purchases”, or “Manage Subscription”.</p>
<ul><li>Tap a plan → the Apple purchase sheet appears → confirm → all features are unlocked.</li><li>Tap “Restore Purchases” → a previous purchase is recovered (requires internet).</li><li>Tap “Manage Subscription” → change or cancel in Apple’s page; charges are collected by Apple.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Tap “Yearly” → confirm in the Apple sheet → Pro unlocked.</li><li>Tap “Restore Purchases” → a prior subscription is restored.</li><li>Tap “Manage Subscription” → Apple’s subscriptions page opens.</li></ul>
<h3>9. Settings &amp; Language</h3>
<p><strong>Input:</strong> pick a language, theme, or a data action.</p>
<ul><li>Change language / theme / refresh interval → the UI updates immediately.</li><li>Clear data / manage permissions / export → the matching screen opens.</li><li>Platform &amp; languages → iOS / iPadOS / macOS, 8 interface languages, themes, Dynamic Type and privacy mode (amounts masked as ******).</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Set language to English → the whole app switches instantly.</li><li>Switch to dark theme → colors change right away.</li></ul>
<h3>10. Export &amp; Backup</h3>
<p><strong>Input:</strong> choose what to export (finance / health analysis / album).</p>
<ul><li>Export → a file (Excel .xlsx) is produced and saved to your device or iCloud Drive.</li><li>Exports are always initiated by you; nothing is sent automatically.</li><li>Automatic backup → a backup is written when the database changes, with a “last backup N days ago” reminder; restoring a backup merges it (only adds, never deletes).</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Export this month’s finance → an .xlsx file saved to Files.</li><li>Export an album → photos written out to the location you choose.</li></ul>
<h3>11. Permissions &amp; Privacy Controls</h3>
<p><strong>Input:</strong> toggle a permission in system Settings, or delete the app.</p>
<ul><li>Health → revoke anytime in the Health app → “Data Access &amp; Devices”.</li><li>Photos → revoke in Settings → Privacy &amp; Security → Photos.</li><li>Microphone / Speech Recognition → revoke in Settings → Privacy &amp; Security.</li><li>Delete the app → all local data is removed (export first to keep it).</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Revoke Photos in Settings → the album grid can no longer read new photos.</li><li>Delete the app → local database gone; the app is reset.</li></ul>`;

 privacy:`<h2>PigPigPlan 隐私政策</h2>
<p class="meta">生效日期：2026 年 10 月 · 平台：iOS / iPadOS / macOS · 版本：v1.0</p>
<div class="callout"><strong>核心承诺。</strong>PigPigPlan 是一款本地优先的记账与个人数据管理应用。你在 App 中产生的所有数据（包括健康数据）只存储在你的设备本地，绝不上传任何服务器；导出数据完全由你自主决定。内置 AI（语音整理、自然语言查询、健康问答、语义搜索）由随 App 打包的小模型（约 0.8B 参数）完全在本机运行，无需联网；语音转文字优先在本机完成，识别出的文字只在本机解析、不会上传到我们的服务器。</div>
<h3>1. 我们处理的数据</h3>
<p>PigPigPlan 处理的全部数据均为你在设备上主动输入或授权读取的数据：</p>
<table><tr><th>类别</th><th>内容</th><th>来源</th></tr>
<tr><td>财务</td><td>账本、收支记录、标签、预算、分期计划</td><td>你主动录入</td></tr>
<tr><td>健康</td><td>心率、HRV、静息心率、睡眠、呼吸、血氧、体温、步数、运动记录、情绪、生理期、日晒</td><td>Apple Health（HealthKit），经你逐项授权</td></tr>
<tr><td>内容</td><td>简易相册照片（含系统相册照片引用）</td><td>你主动导入 / 拍摄 / 授权读取系统相册</td></tr>
<tr><td>偏好</td><td>语言、主题、健康刷新间隔等</td><td>本地产生</td></tr></table>
<p>我们<strong>不</strong>收集：姓名、邮箱、手机号、通讯录、位置、广告标识符（IDFA）等用于追踪的设备标识符。</p>
<h3>2. 存储与处理</h3>
<ul>
<li><strong>100% 本地存储：</strong>所有数据加密存储在设备本地数据库（SQLCipher，AES-256）。</li>
<li><strong>设备端 AI：</strong>AI 功能（自然语言查询、语音整理、健康问答、语义搜索）由内置的小模型（约 0.8B 参数）完全在本机运行：不需要联网，也不使用 Apple Intelligence 或任何第三方云端，查询内容不会离开设备。</li>
<li><strong>语音、地图与健康：</strong>语音转文字优先在本机完成，相册语音建册始终要求本机识别；设备或语言不支持时由 Apple 语音识别服务处理（需联网），识别出的文字只在本机解析，不会上传到我们的服务器。只有天气、路况地图、路线（ETA）与交通预测，以及相册地点索引会向 Apple 发送数据——天气发送坐标（城市名由 Apple 地图反查）；路况地图由 Apple 地图绘制；ETA 与交通预测把起点/终点交给 Apple 地图计算路线与耗时（交通预测会按当天各时段分别请求预测耗时）；相册地点索引发送照片坐标以反查地名。照片本身不会上传。你在封面上设置的起终点、收藏与最近使用的路线只保存在本机偏好中，不会上传。健康数据经你授权后读取；你手动输入（含语音确认）的健康记录，经你授权后写回 Apple 健康（HealthKit）。</li>
<li><strong>无服务器、无账号：</strong>我们没有接收你数据的服务器，无需注册账号，App 不含任何广告、统计或第三方分析 SDK。（自动备份保存在<strong>你自己的</strong> iCloud Drive，不经过我们的服务器。）</li>
<li><strong>用途：</strong>数据仅用于你本人使用的功能——记账、健康压力分析、语义搜索、照片管理。</li>
</ul>
<h3>3. 健康数据（HealthKit）专项声明</h3>
<p>PigPigPlan 通过 Apple HealthKit 读取健康数据，用于<strong>压力分析</strong>（基于 HRV、静息心率、睡眠等）与健康趋势展示。</p>
<ul>
<li><strong>授权方式：</strong>读取前会弹出系统授权框，由你逐项选择允许的类型。</li>
<li><strong>使用范围：</strong>健康数据仅在设备本地用于上述分析与展示。</li>
<li><strong>禁止行为：</strong>我们不会将健康数据用于广告、出售或向任何第三方披露。</li>
<li><strong>写入：</strong>你在 App 内手动输入（含语音确认）的健康记录，经你授权后写回 Apple 健康（HealthKit），仅写入你允许的类型；撤销授权即停止写入。</li>
<li><strong>撤销：</strong>在系统「健康」App 的「数据访问与设备」中关闭授权，或删除本 App，即停止一切访问。</li>
</ul>
<h3>4. 导出功能声明</h3>
<p>你拥有数据的完整控制权，<strong>导出完全由你主动发起</strong>。App 可将你自己的数据（财务账本、健康分析结果、相册照片）导出为 Excel（.xlsx）或文件，保存到你的设备或 iCloud Drive。导出仅用于你个人备份、迁移或分析，不会被自动发送给任何第三方。本 App 不提供任何第三方 API 访问你的数据。</p>
<h3>5. 数据安全</h3>
<ul><li>数据库使用 <strong>SQLCipher</strong>（AES-256）本地加密存储。</li><li>健康数据在 Apple 系统安全容器内处理。</li><li>设备锁定与系统安全机制保护你的数据。</li></ul>
<h3>6. 数据保留与删除</h3>
<table><tr><th>操作</th><th>结果</th></tr>
<tr><td>删除单条记录</td><td>立即从本地数据库删除</td></tr>
<tr><td>删除账本/相册</td><td>连带删除其下数据</td></tr>
<tr><td>删除 App</td><td>本地数据随之删除（如需保留请先手动导出）。自动备份副本保存在你自己的 iCloud Drive（「文件 → iCloud 云盘 → PigPigPlan」），删除 App 后仍会保留；如需一并删除，请在「文件」App 里删除该文件夹。</td></tr>
<tr><td>关闭健康授权</td><td>App 立即停止读取该类型健康数据</td></tr></table>
<h3>7. 儿童隐私</h3>
<p>本 App 不面向 13 岁以下儿童，也不会主动收集儿童个人信息。</p>
<h3>8. 第三方服务</h3>
<p>本 App 不集成任何第三方广告、统计或分析服务。唯一依赖为 Apple HealthKit / SwiftUI / MLX / WeatherKit（Apple 框架）与本地开源库（SQLite 等），仅用于本机处理。</p>
<h3>9. 政策变更与联系</h3>
<p>若本政策发生变更，我们会更新本页面并标注生效日期，且不追溯处理历史数据。如有疑问，可通过 App 内置「关于」页面或 App Store 开发者联系方式与我们联系。</p>
<h3>10. 需要联网的功能</h3>
<p>天气、路况地图、路线（ETA）与交通预测、订阅购买/恢复，以及相册「翻译增强查询」首次下载语言包时需要联网。仅发送必要的最少信息——获取天气时向 Apple 的天气服务（Apple Weather）发送你的坐标（城市名由 Apple 地图反查），路况地图向 Apple 地图请求地图内容，ETA 与交通预测向 Apple 地图发送起点/终点以计算路线与耗时，相册地点索引向 Apple 地图发送照片坐标以反查地名；不含任何个人身份信息。其余功能（记账、健康分析、设备支持本机识别时的语音、语义查询）可离线使用。</p>
<h3>11. 系统相册与照片整理</h3>
<p>整理系统相册时，App 仅通过系统 PhotoKit 读取照片的引用标识与元数据（拍摄时间、位置、类型），不复制、不上传照片。本机生成的分析标签（场景、文字等）只存储在设备本地的加密数据库中，可随时在 App 内清除。App 不使用系统「人物与宠物」等人脸分组数据，也不进行人脸识别。建立地点索引时，App 会把照片坐标（不含照片本身）发送给 Apple 地图反查地名；返回的地名文字只保存在本机加密数据库。</p>
<h3>12. 本地备份与恢复</h3>
<p>App 内「设置 → 备份」可导出 / 恢复你自己的备份文件。</p>
<ul>
<li>备份包<strong>只包含</strong>你本机加密数据库中的业务数据：财务数据、相册清单、偏好设置等。用于搜索的语义索引（包括由照片、健康摘要等在本机自动生成的向量索引）存放在独立的向量库中，<strong>不会进入备份包</strong>，恢复后会在本机自动重建。</li>
<li>备份包<strong>不包含健康数据</strong>（含从 Apple「健康」读取的采样与本机生成的压力分析）。这些数据始终由 Apple「健康」App 保管，你在新设备上重新授权后会自动重新同步，无需也不应再复制一份。</li>
<li>备份包<strong>不包含</strong>照片文件；换机后可在系统相册重新选择或重新导入。</li>
<li>我们不会、也无法把你的数据上传到<strong>我们的</strong>服务器（无账号、无服务器）。本 App 已将数据库目录标记为不参与 iCloud 备份。此外，一份仅含数据库的自动备份副本（<strong>不含照片、不含健康数据</strong>）会通过 iCloud 文稿保存到<strong>你自己的</strong> iCloud Drive，因此删除或重装 App 后仍可恢复。你也可以在 App 内「设置 → 备份」手动导出备份。</li>
</ul>

 guide:`<h2>PigPigPlan 操作说明</h2>
<p class="meta">全部在本机运行，无需注册账号。每节都提供「输入 → 输出」与多个可照做的示例。</p>
<h3>1. 首次启动</h3>
<p><strong>输入：</strong>无需任何输入，直接打开 App 即可。</p>
<ul><li>打开 App → 自动建立本机加密数据库（无需注册）。</li><li>随后进入封面页，显示页签：财务、健康、相册，以及 工具 / 个人 / 设置。</li><li>封面还常驻显示：天气（当前天气、预报、穿搭与紫外线建议，数据来自 Apple Weather）、路况地图（半径与自动刷新菜单、ⓘ 配色说明、↗ 在地图中打开）、ETA 与交通预测（⏱ 设置 ETA、🕘▾ 最近使用、📈 当天逐小时预测）——详见第 6 节。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>在新设备上首次安装 → 数据库初始化完成，显示封面页。</li><li>稍后再次打开 → 先前的数据仍在。</li></ul>
<h3>2. 主页与导航</h3>
<p><strong>输入：</strong>点击页签、封面上的 👑（皇冠）或 ⚙️。</p>
<ul><li>点击页签 → 打开对应模块。</li><li>点击封面上的 👑 → 打开订阅（Pro）页。</li><li>点击 ⚙️ → 打开设置（语言、主题、刷新间隔、数据）。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>点「健康」→ 进入显示各项指标的健康面板。</li><li>点 ⚙️ → 设置 → 把语言改为「简体中文」。</li></ul>
<h3>3. 财务</h3>
<p><strong>输入：</strong>金额、标签、日期、备注（可手输，或说一句话）。</p>

<h3>4. 健康</h3>

<h3>5. 简易相册</h3>

<h3>11. システム写真と写真整理</h3>
<p>システム写真を整理する際、本アプリは PhotoKit を通じて写真の参照識別子とメタデータ（撮影日時・場所・種類）のみを読み取り、写真を複製・アップロードしません。端末内で生成された分析ラベル（シーン・文字など）は端末内の暗号化データベースにのみ保存され、アプリ内でいつでも削除できます。本アプリは「人とペット」などの顔グループデータを使用せず、顔認識も行いません。地点索引を作成するとき、アプリは写真の座標（写真自体は含みません）を Apple マップに送信して地名を逆引きします。返された地名テキストだけを端末内の暗号化データベースに保存します。</p>
<h3>12. ローカルバックアップと復元</h3>
<p>「設定 → バックアップ」から、ご自身のバックアップファイルを書き出し・復元できます。</p>
<ul>
<li>バックアップに含まれるのは、端末内の暗号化データベースにある業務データ（財務データ、アルバムの一覧、設定など）<strong>のみ</strong>です。検索用のインデックス（写真や健康サマリーなどから端末内で自動生成されるベクトル索引を含む）は別のベクトルデータベースに保存され、<strong>バックアップには含まれません</strong>。復元後に端末内で自動的に再構築されます。</li>
<li>バックアップに<strong>健康データは含まれません</strong>（Apple「ヘルスケア」から読み取ったサンプル、および端末上で算出したストレス分析を含む）。これらのデータは常に Apple「ヘルスケア」App が管理しており、新しい端末で再許可すると自動的に再同期されるため、複製する必要も、すべきでもありません。</li>
<li>バックアップに<strong>写真ファイルは含まれません</strong>。機種変更後はシステムの写真ライブラリから再選択するか、再インポートしてください。</li>
<li>当社はあなたのデータを<strong>当社の</strong>サーバーにアップロードすることはできず、また行いません（アカウントなし、サーバーなし）。本 App はデータベースディレクトリを iCloud バックアップ対象外に設定しています。さらに、データベースのみの自動バックアップのコピー（<strong>写真と健康データを含まない</strong>）が iCloud ドキュメントを通じて<strong>あなた自身の</strong> iCloud Drive に保存されるため、アプリを削除・再インストールしても復元できます。アプリ内「設定 → バックアップ」から手動で書き出すこともできます。</li>
</ul>

I18N["ja"].guide=`<h2>PigPigPlan 操作ガイド</h2>
<p class="meta">すべて端末内で動作し、アカウント登録は不要です。各セクションで「入力 → 出力」と、そのまま試せる例を複数示します。</p>
<h3>1. 初回起動</h3>
<p><strong>入力：</strong>入力は不要。アプリを開くだけです。</p>
<ul><li>アプリを開く → 端末内の暗号化データベースが自動で作成されます（登録不要）。</li><li>その後カバー画面が表示され、タブ：家計・健康・アルバム、および ツール / パーソナル / 設定 が出ます。</li><li>カバーには、天気（現在の天気・予報・服装と紫外線の提案、データは Apple Weather）、交通マップ（範囲と自動更新のメニュー、ⓘ 色の凡例、↗ マップで開く）、ETA と交通予測（⏱ ETA を設定、🕘▾ 最近のルート、📈 当日の時間別予測）が常時表示されます——詳細は第 6 節。</li></ul>
<p><strong>例：</strong></p>
<ul><li>新しい端末で初めてインストール → データベースが初期化され、カバー画面が表示される。</li><li>後で再度開く → 以前のデータがそのまま残っている。</li></ul>
<h3>2. ホームとナビゲーション</h3>
<p><strong>入力：</strong>タブ、カバーの 👑（王冠）、または ⚙️ をタップします。</p>
<ul><li>タブをタップ → そのモジュールが開きます。</li><li>カバーの 👑 をタップ → サブスクリプション（Pro）画面が開きます。</li><li>⚙️ をタップ → 設定（言語・テーマ・更新間隔・データ）が開きます。</li></ul>
<p><strong>例：</strong></p>
<ul><li>「健康」をタップ → 各指標を表示する健康ダッシュボードへ。</li><li>⚙️ をタップ → 設定 → 言語を「日本語」に変更。</li></ul>
<h3>3. 家計</h3>
<p><strong>入力：</strong>金額・タグ・日付・メモ（手入力、または一言話す）。</p>
<ul><li>家計簿を作成して取引を追加 → リストに即時追加され、合計とグラフが同期更新されます。</li><li>音声入力 → マイクをタップして一言話す → 「確認カード」が出る → 確認をタップで保存。</li><li>言い足りない場合 → 話した内容で「確認カード」が開き、金額・タグ・日付・メモが入っています。足りない項目を補い、違うところを直してから確認をタップすると保存されます。金額がまったく聞き取れないときは、もう一度話すよう案内します。</li><li>分割払いの入力 → 「車を30回払い、1回1300」と言う → 入力画面に「総額39000・30回・1回1300」が入り、回数を36に変えると総額が46800に更新され、1回1300は維持されます。</li><li>予算を設定（タグ + 期間 + 金額）→ そのタグに「使用済み / 予算」の進捗バーが表示されます。</li><li>自然言語で質問 → 絞り込んだ結果を返します（すべて端末内で計算）。</li><li>プランの質問 → 支払いが残っているか尋ねる（例「7月もスマホの分割を払う」）→ 分割払いのプラン結果カードに支払い済み N/M 回・残り R 回・残りの支払額も表示されます。通常の支出の質問は取引検索のままです。</li><li>プライバシーモード → 金額は既定で ****** と非表示。上部の 👁️「数字の表示 / 非表示」ボタンで実際の金額を表示（もう一度押すと非表示）。</li><li>グラフとレポート → 支出構成の円グラフ、カテゴリ別棒グラフ、収支トレンド折れ線、カテゴリ別支出トレンド、カテゴリ別ランキング、前期比レポート。すべて端末内で計算。</li><li>音声検索 → マイクをタップして質問を話す（例「今月の食費はいくら」）→ 答えは端末内で計算。</li><li>複数家計簿 → 家計簿の作成・削除・切り替え。家計簿ごとに合計とグラフを集計します。</li><li>カスタム検索 → 複数の家計簿 + 摘要/メモのキーワード + タグの複数選択 + 期間で絞り込み、ページ送りで表示。</li><li>プラン管理 → 分割払い / サブスクを一時停止・再開・解約・今回分の支払い済みにできます（実行前に確認）。</li><li>入力後の編集・削除 → 明細リストの各行の右に「✎ 編集」「🗑 削除」ボタンがあります（iOS では左スワイプでも削除、長押しで「編集 / 削除」メニュー）。検索結果は行をタップすると全画面の明細が開き、そこで編集・削除できます。削除は必ず確認が出ます。</li></ul>
<p><strong>例：</strong></p>
<ul><li>「昼食 35」と言う → 確認カード「支出 35 · 食事」。</li><li>「予算 スーパー 2000 毎月」と言う → スーパーの月予算 2000 を設定。</li><li>「今月の食費はいくら」と入力 → 今月の食費合計を返す。</li><li>「7月もスマホの分割を払う」と入力 → プランカードにその月の支払い、残り回数、残額が表示されます。</li></ul>
<h3>4. 健康</h3>
<p><strong>入力：</strong>共有したい健康タイプを必要な分だけ許可し、指標を開きます。音声入力も使えます。</p>
<ul><li>健康タブで項目ごとに許可 → 心拍数・HRV・睡眠・ワークアウト・体温・血中酸素・歩数・気分などのカードが表示されます。</li><li>ヘルスケアの許可画面 → 共有する項目をすべてオンにしたうえで、<strong>画面のいちばん下までスクロール</strong>して「許可」をタップすると有効になります（確認ボタンはリストの末尾にあり、下までスクロールしないと見えません）。</li><li>「ストレス」を開く → HRV / 安静時心拍数 / 睡眠から端末内で計算したストレス値。</li><li>マイクをタップして数値を言う → 確認待ちのエントリが生成されます。</li><li>言い足りない場合 → 話した内容で確認待ちカードが開き、指標・数値・時刻が入っています。足りない項目を補い、違うところを直してから確認をタップすると保存されます。健康記録として認識できなかったときは、例文を案内します。</li><li>音声 / 自然言語クエリ → 「どの日が一番ストレスが高い？」と尋ねる → ストレス / 睡眠 / ワークアウトのデータに振り分けて端末内で計算。</li><li>トレンドグラフ → 総合健康トレンド（ストレス / HRV / 安静時心拍数 / 睡眠）と気分トレンドグラフ。レポートは Excel に書き出せます。</li><li>健康 Q&amp;A → 「今週の睡眠はどう？」「どの日が一番ストレスが高い？」と質問 → 端末内 AI が健康データから回答。</li><li>マイ記録 → 任意の 1 件をタップすると確認カードが再び開き、数値 / 時刻 / 運動の種類を直して保存できます（「ヘルスケア」に書き戻した分も更新）。左スワイプで削除すると、端末内の記録と「ヘルスケア」のコピーがまとめて消えます。</li><li>自己申告のワークアウト → 日付 + 運動の種類 + 時間 +（任意の）消費カロリーをまとめて記録。カロリーは実際に言ったときだけ保存し、推定はしません。</li></ul>
<p><strong>例：</strong></p>
<ul><li>「心拍数」と「睡眠」を許可 → 今日の安静時心拍と昨夜の睡眠を表示。</li><li>「血圧 120 80」と言う → 確認待ちの血圧記録。</li><li>「体重 68」と言う → 確認待ちの体重記録。</li><li>「頭が痛い、肩も痛い」と言う → まとめて2件の確認カードを作成。</li><li>「昨日 30 分ランニング、280 キロカロリー消費」と言う → 「日付 昨日 + 種類 ランニング + 30 分 + 280 kcal」を記録。マイ記録でタップすれば種類・時間・カロリーを直せます。</li></ul>
<h3>5. 簡易アルバム</h3>
<p><strong>入力：</strong>写真アクセスを許可し、フィルタで写真を選びます。</p>
<ul><li>アルバム内：下部の<strong>システム写真から追加</strong>→ システムの選択画面で写真を選ぶ；<strong>写真を追加</strong>→ システム写真を 時間 / 場所 / 種類 で絞り込んでから選択分をアルバムに追加。</li><li>許可 → システム写真のグリッドを読み取れます。</li><li>時間 / 場所 / 種類 / お気に入り / スクリーンショット / パノラマ / 連写 / ライブ で絞り込み → 一致する写真にグリッドが絞られます。</li>
<li>場所検索には<strong>世界 5 万以上の都市・地域</strong>の地名が入っています（8 言語が相互に一致するので、中国語名でも現地語の綴りでもヒットします）。都市名で見つからないときは<strong>都市名または省 / 州名</strong>で試してください（例：広東省 / Guangdong、ハワイ / Hawaii）。表にない地名は Apple マップにもう一度問い合わせ、それでも見つからなければ元の語のまま残します（推測はしません）。</li><li>場所インデックス内の地名は Apple マップ（Apple Maps）が座標から生成しています。Apple マップのデータの制約により、App の言語をフランス語など中国語以外に設定していても、中国国内の一部の地名が中国語で返されることがあります（App の言語設定が反映されていないわけではありません）。その場合は「場所（任意）」で英語名を使うか、都市名（例：Guangzhou / 广州市）を直接入力して再検索してください。</li><li>写真を選択 → アルバム作成・並べ替え・スライドショー、またはスライドショー再生中にアルバムを MP4 に書き出し。</li><li>写真の参照とメタデータのみを読み取り、複製もアップロードもしません。</li><li>アルバム音声 → 「写真を探す」画面で音声ボタンを押したまま条件を話します（例：「2024年8月の東京の写真」「スクリーンショットだけ」「直近 30 日の動画」）→ グリッドが絞られ該当写真が選択され、「アルバムを作成」でアルバムになります。「〜という名前」と言えばアルバム名を指定できます（言わなければ条件から自動命名）。音声は端末内でのみ認識します。</li><li>重複写真を検出 → アルバム詳細で「重複写真を検出」をタップ：似た写真をスキャンしてグループ化し、余分なものを選択（長押しで拡大）→「選択を削除」でまとめて整理できます。システム写真は「最近削除した項目」に入るので復元も可能です。</li></ul>
<p><strong>例：</strong></p>
<ul><li>「スクリーンショット」で絞り込み → スクリーンショットだけが一覧表示。</li><li>20 枚選択 → アルバムを作成 → スライドショーを再生 → 🎞（MP4 に書き出し）をタップ → 端末に保存されたスライドショー動画。</li><li>アルバム → 重複写真を検出 → 余分なものを選択 → 選択を削除 → 重複が片付く（システム写真は「最近削除した項目」から復元可）。</li><li>App の言語がフランス語なのに地名が中国語で表示される → 「場所（任意）」に Guangzhou または 广州市 を入力 → 「検索」をタップ。</li><li>都市名で見つからない → 省 / 州名で検索し直す（例：Guangdong、Hawaii）→ その地域の写真がまとまって表示されます。</li></ul>
<h3>6. 天気とルート（交通）</h3>
<p><strong>入力：</strong>天気を開く（位置情報を使用）。ルートは出発地・目的地・移動手段を設定します。</p>
<ul><li>天気を開く → 現在の天気と予報（データは Apple Weather。取得時に座標を送信）。</li><li>天気は自動更新 → 前面に戻ったとき、またはカバーに留まっているときに 3 時間を超えると自動で更新（バックグラウンドでは更新しません）。↻ で手動更新：交通マップはすぐ再描画、天気は 1 時間以内ならキャッシュを再利用。</li><li>カバーの地図 → 周辺の交通状況を Apple マップの色で表示。2 つのメニューで半径と自動更新の間隔を設定でき、ⓘ で配色の説明、↗ で Apple マップで開きます。ETA を設定すると同じ地図がルート表示に切り替わります（選択中の案はマゼンタ、代替は濃紺）。</li><li>ETA を設定 → 出発地と目的地（住所検索または現在地）+ 移動手段（車 / 徒歩 / 自転車）を選ぶ → カバーに「16 分 · 3.2 km」と地図上のルート（Apple マップが計算）、順調 / やや混雑 / 渋滞の判定、「30 分後」の予測、各案の所要時間チップを表示。別のチップを押すとルートを切り替えます。</li><li>ETA の操作行 → ⇅ で出発地と目的地を入れ替え（方向を固定）、🕘▾ で最近のルート、✎ で編集、↗ で Apple マップで開く。よく使うルートはお気に入りとして保存できます。目的地の近くに来るとルートが自動で逆方向になり「逆方向」バッジが出ます。</li><li>交通予測（📈）→ あるルートの当日の 1 時間ごとの所要時間、順調 / やや混雑 / 渋滞の時間帯と平均所要時間、折れ線グラフと時間別の明細を表示し、Excel に書き出せます。ETA を設定していなくても使えます（お気に入りかカスタムルートを選択）。所要時間は Apple マップの推定が楽観的なため、少し上乗せして表示します。カスタムルートの出発地/目的地は「現在地」から直接設定できます。</li><li>カバーの提案 → 服装アドバイス、持ち物の注意、UV 警告（日没前のピーク）、気象警報を予報から端末内で計算。</li></ul>
<p><strong>例：</strong></p>
<ul><li>天気を開く → 今日の気温と 7 日間予報を表示。</li><li>カバーに 3 時間以上留まる、またはバックグラウンドで 3 時間後に戻る → ↻ を押さなくても天気が自動更新。</li><li>自宅 → 会社、手段「車」→ 距離・所要時間・地図上のルートを表示。</li><li>手段を「徒歩」に変更 → ETA が徒歩時間に更新。</li><li>「交通予測」を開く → 朝夕のピークが最も遅い。出発時刻を遅らせる → ETA が短くなる。</li><li>ETA を設定せず 📈 を押す → 「カスタムルート」を選ぶ → 今日の時間帯別の予測 → Excel に書き出し。</li><li>別の所要時間チップを押す → 地図が代替ルートに切り替わる。</li><li>夕方に会社の近くまで戻る → ルートが自動で「会社 → 自宅」に反転。</li></ul>
<h3>7. 検索</h3>
<p><strong>入力：</strong>キーワード、質問、または音声コマンド。各モジュールは自分のデータだけを検索します。</p>
<ul><li>家計 → 自然言語で質問（「今月の食費はいくら」）、カスタム検索（家計簿 + キーワード + タグ + 期間）、またはプラン操作（一時停止 / 再開 / 解約 / 今回分を支払い済み → 先に確認カード）。</li><li>健康 → 自分の健康データについて質問（「どの日が一番ストレスが高い」「今週の睡眠はどう」）→ 端末内で計算して回答。</li><li>アルバム → 時間 / 場所 / 種類で絞り込み、または音声コマンド。地名は Apple 翻訳で英語に訳して一緒に照合できます（初回は言語パックのダウンロードが必要）。</li><li>解析と計算はすべて端末内で行われ、検索内容と結果はアップロードされません。</li></ul>
<p><strong>例：</strong></p>
<ul><li>「先月の交通費」と入力 → 一致する家計の記録と合計。</li><li>「今週の睡眠はどう」と質問 → 睡眠データをもとに端末内で回答。</li><li>「去年ソウルの写真」と言う → アルバムのグリッドが該当写真に絞られる。</li></ul>
<h3>8. サブスクリプション（Pro）</h3>

<p class="meta">시행일: 2026년 10월 · 플랫폼: iOS / iPadOS / macOS · 버전: v1.0</p>
<div class="callout"><strong>핵심 약속.</strong> PigPigPlan은 로컬 우선(local-first) 방식의 가계부·개인 데이터 관리 앱입니다. 앱에서 생성하는 모든 데이터(건강 데이터 포함)는 사용자 기기에만 저장되며 어떤 서버에도 업로드되지 않습니다. 내보내기는 항상 사용자가 직접 시작합니다. 내장 AI(음성 입력 정리, 자연어 쿼리, 건강 Q&amp;A, 의미 검색)는 앱에 포함된 소형 모델(약 0.8B 파라미터)로 기기에서 실행되며 인터넷 연결이 필요 없습니다. 음성-텍스트 변환은 가능하면 기기에서 수행하고, 인식된 텍스트는 기기에서만 처리되며 당사 서버로 업로드되지 않습니다.</div>

<tr><td>설정</td><td>언어, 테마, 건강 갱신 간격 등</td><td>기기 내 생성</td></tr></table>
<p>수집하지 않음: 이름, 이메일, 전화번호, 연락처, 위치, 광고 식별자(IDFA) 등.</p>
<h3>2. 저장 및 처리</h3>
<ul>

<h3>3. HealthKit 특별 고지</h3>
<p>PigPigPlan은 스트레스 분석(HRV, 안정 시 심박수, 수면 등 기반) 및 건강 추세 표시를 위해 Apple HealthKit을 통해 건강 데이터를 읽습니다.</p>

<li><strong>금지 사항</strong>: 광고 이용·판매·제3자 공개를 하지 않습니다;</li>
<li><strong>쓰기:</strong> 앱에서 직접 입력(음성 확인 포함)한 건강 기록은 승인 후 Apple 건강(HealthKit)에 기록되며, 승인한 유형만 기록됩니다. 승인을 철회하면 쓰기도 중단됩니다.</li>
<li><strong>철회</strong>: 건강 앱의 '데이터 접근'에서 허가를 끄거나 앱을 삭제하면 즉시 접근이 중단됩니다.</li>
</ul>
<h3>4. 데이터 내보내기</h3>

<ul>

<li>본 앱은 제3자 API 접근을 제공하지 않습니다.</li>

<h3>5. 데이터 보안</h3>
<ul><li>데이터베이스는 SQLCipher(AES-256)로 기기 내 암호화;</li><li>건강 데이터는 Apple 시스템 보안 컨테이너에서 처리;</li><li>기기 잠금 및 OS 보안이 데이터를 보호합니다.</li></ul>

<p>날씨, 교통 지도, 경로(ETA)와 교통 예측, 구독 구매/복원, 앨범 '번역 강화 검색'의 첫 언어 팩 다운로드에는 인터넷 연결이 필요합니다. 필요한 최소 정보만 전송합니다. 날씨를 가져올 때 좌표를 Apple Weather로(도시 이름은 Apple 지도에서 역지오코딩), 교통 지도는 Apple 지도에서 지도 콘텐츠를 가져오고, ETA와 교통 예측은 출발지/도착지를 Apple 지도로 보내 경로와 소요 시간을 계산하며, 앨범 장소 색인에서는 사진 좌표를 Apple 지도로 보내 지명을 역지오코딩합니다. 개인 식별 정보는 포함하지 않습니다. 그 외 기능(가계부, 건강 분석, 기기 내 인식 지원 시 음성, 의미 검색)은 오프라인으로 사용할 수 있습니다.</p>

<p>「설정 → 백업」에서 직접 백업 파일을 내보내고 복원할 수 있습니다.</p>

<li>당사는 귀하의 데이터를 <strong>당사</strong> 서버로 업로드할 수 없으며 업로드하지 않습니다(계정 없음, 서버 없음). 이 앱은 데이터베이스 디렉토리를 iCloud 백업에서 제외하도록 표시했습니다. 또한 데이터베이스만 담긴 자동 백업 사본(<strong>사진과 건강 데이터 제외</strong>)이 iCloud 문서를 통해 <strong>귀하의</strong> iCloud Drive에 저장되므로 앱을 삭제하거나 재설치해도 복원할 수 있습니다. 「설정 → 백업」에서 수동으로 내보낼 수도 있습니다.</li>

I18N["ko"].guide=`<h2>PigPigPlan 사용 안내</h2>
<p class="meta">전 과정이 기기에서 실행되며 계정 등록이 필요 없습니다. 각 항목은 「입력 → 출력」과 바로 따라 할 수 있는 예시를 제공합니다.</p>
<h3>1. 최초 실행</h3>
<p><strong>입력:</strong> 입력은 필요 없습니다. 앱을 열기만 하면 됩니다.</p>
<ul><li>앱 열기 → 기기 내 암호화 데이터베이스가 자동 생성됩니다(등록 불필요).</li><li>이어서 커버 화면이 표시되고 탭이 나타납니다: 가계부, 건강, 앨범, 그리고 도구 / 개인 / 설정.</li><li>커버에는 날씨(현재 날씨·예보·옷차림과 자외선 제안, 데이터는 Apple Weather), 교통 지도(반경 및 자동 갱신 메뉴, ⓘ 색상 범례, ↗ 지도에서 열기), ETA와 교통 예측(⏱ ETA 설정, 🕘▾ 최근 경로, 📈 오늘의 시간별 예측)이 항상 표시됩니다 — 자세한 내용은 6장.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>새 기기에 처음 설치 → 데이터베이스가 초기화되고 커버 화면이 표시됩니다.</li><li>나중에 다시 열기 → 이전 데이터가 그대로 남아 있습니다.</li></ul>
<h3>2. 홈과 내비게이션</h3>
<p><strong>입력:</strong> 탭, 커버의 👑(왕관) 또는 ⚙️를 누릅니다.</p>
<ul><li>탭을 누름 → 해당 모듈이 열립니다.</li><li>커버의 👑를 누름 → 구독(Pro) 페이지가 열립니다.</li><li>⚙️를 누름 → 설정(언어, 테마, 갱신 간격, 데이터)이 열립니다.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>「건강」을 누름 → 각 지표를 보여 주는 건강 대시보드로 이동.</li><li>⚙️를 누름 → 설정 → 언어를 「한국어」로 변경.</li></ul>
<h3>3. 가계부</h3>
<p><strong>입력:</strong> 금액, 태그, 날짜, 메모(직접 입력하거나 한 문장으로 말하기).</p>
<ul><li>장부를 만들어 거래를 추가 → 목록에 즉시 추가되고 합계와 차트가 함께 갱신됩니다.</li><li>음성 입력 → 마이크를 누르고 말하기 → 「확인 카드」가 나타남 → 확인을 누르면 저장됩니다.</li><li>말이 불완전해도 → 말한 내용대로 「확인 카드」가 열리고 금액·태그·날짜·메모가 채워집니다. 빠진 항목을 채우고 틀린 부분을 고친 뒤 확인을 누르면 저장됩니다. 금액을 전혀 인식하지 못하면 다시 말해 달라는 안내가 표시됩니다.</li><li>할부 입력 → “차 30개월, 1회 1300”이라고 말하면 → 입력 창에 “총액 39000 · 30회 · 회당 1300”이 채워지고, 횟수를 36으로 바꾸면 총액이 46800으로 바뀌며 회당 1300은 유지됩니다.</li><li>예산 설정(태그 + 기간 + 금액) → 해당 태그에 「사용/예산」 진행 막대가 표시됩니다.</li><li>자연어로 질문 → 필터링된 결과를 반환합니다(전부 기기에서 계산).</li><li>플랜 질문 → 결제가 남았는지 묻기(예: “7월에도 핸드폰 할부 내나요”) → 할부 플랜 결과 카드에 납부 N/M회, 남은 R회, 남은 납부액도 표시됩니다. 일반 지출 질문은 거래 조회로 처리됩니다.</li><li>개인정보 모드 → 금액은 기본적으로 ****** 로 가려집니다. 상단의 👁️「숫자 표시 / 숨기기」버튼을 누르면 실제 금액이 표시됩니다(다시 누르면 숨김).</li><li>차트 및 리포트 → 지출 구성 원형 차트, 분류 막대 차트, 수입/지출 추세 선, 분류별 지출 추세, 분류 순위, 전기 대비 리포트. 모두 기기에서 계산됩니다.</li><li>음성 질의 → 마이크를 누르고 질문을 말하기(예: "이번 달 식비는 얼마") → 답은 기기에서 계산.</li><li>여러 가계부 → 가계부를 만들고 삭제하고 전환하며, 가계부마다 합계와 차트를 따로 집계합니다.</li><li>맞춤 쿼리 → 여러 가계부 + 요약/메모 키워드 + 태그 다중 선택 + 기간으로 필터링하고 페이지 단위로 봅니다.</li><li>플랜 관리 → 할부/구독을 일시중지, 재개, 취소, 이번 회차 결제 완료로 표시할 수 있으며 실행 전에 확인합니다.</li><li>입력 후 편집·삭제 → 장부 목록의 각 행 오른쪽에 「✎ 편집」「🗑 삭제」 버튼이 있습니다(iOS는 왼쪽으로 밀어 삭제, 길게 누르면 「편집 / 삭제」 메뉴). 검색 결과는 행을 누르면 전체 화면 상세가 열리고 거기서 편집·삭제할 수 있습니다. 삭제는 항상 확인을 거칩니다.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>「점심 35」라고 말하기 → 확인 카드 「지출 35 · 식비」.</li><li>「예산 마트 2000 매월」이라고 말하기 → 마트 월 예산 2000 설정.</li><li>「이번 달 식비는 얼마」라고 입력 → 이번 달 식비 합계 반환.</li><li>“7월에도 핸드폰 할부 내나요” 입력 → 플랜 카드에 해당 월 결제액, 남은 횟수, 남은 금액이 표시됩니다.</li></ul>
<h3>4. 건강</h3>
<p><strong>입력:</strong> 공유할 건강 유형을 필요한 만큼 허가한 뒤 지표를 엽니다. 음성 입력도 지원합니다.</p>
<ul><li>건강 탭에서 항목별로 허가 → 심박수, HRV, 수면, 운동, 체온, 혈중산소, 걸음 수, 기분 등의 카드가 표시됩니다.</li><li>건강 접근 권한 화면 → 공유할 항목을 모두 켠 뒤 <strong>화면 맨 아래까지 스크롤</strong>해서 「허용」을 눌러야 권한이 적용됩니다(확인 버튼이 목록 끝에 있어 아래로 내려야 보입니다).</li><li>「스트레스」 열기 → HRV / 안정 시 심박수 / 수면을 기반으로 기기에서 계산한 스트레스 값.</li><li>마이크를 누르고 수치를 말하기 → 확인 대기 항목이 생성됩니다.</li><li>말이 불완전해도 → 말한 내용대로 확인 대기 카드가 열리고 지표·수치·시간이 채워집니다. 빠진 항목을 채우고 틀린 부분을 고친 뒤 확인을 누르면 저장됩니다. 건강 기록으로 인식하지 못하면 예시 문장을 안내합니다.</li><li>음성 / 자연어 질의 → "언제 스트레스가 가장 높았어?"라고 묻기 → 스트레스 / 수면 / 운동 데이터로 라우팅되어 기기에서 계산.</li><li>추세 차트 → 종합 건강 추세(스트레스 / HRV / 안정 시 심박수 / 수면)와 기분 추세 차트. 리포트는 Excel로 내보낼 수 있습니다.</li><li>건강 Q&amp;A → “이번 주 수면 어때?”, “언제 스트레스가 가장 높았어?”라고 물으면 기기 내 AI가 건강 데이터로 답합니다.</li><li>내 기록 → 항목을 누르면 확인 카드가 다시 열려 값 / 시간 / 운동 종류를 고쳐 저장할 수 있습니다(「건강」에 기록한 사본도 함께 갱신). 왼쪽으로 밀어 삭제하면 기기 기록과 「건강」의 사본이 함께 지워집니다.</li><li>직접 입력 운동 → 날짜 + 운동 종류 + 시간 + (선택) 소모 칼로리를 함께 기록합니다. 칼로리는 직접 말했을 때만 저장하며 절대 추정하지 않습니다.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>「심박수」와 「수면」을 허가 → 오늘의 안정 시 심박수와 어젯밤 수면 표시.</li><li>「혈압 120 80」이라고 말하기 → 확인 대기 혈압 기록.</li><li>「체중 68」이라고 말하기 → 확인 대기 체중 기록.</li><li>“머리가 아프고 어깨도 아파요”라고 말하면 → 한 번에 두 개의 확인 카드 생성.</li><li>“어제 30분 달리기, 280칼로리 소모”라고 말하면 → 「날짜 어제 + 종류 달리기 + 30분 + 280kcal」로 기록됩니다. 내 기록에서 눌러 종류·시간·칼로리를 수정할 수 있습니다.</li></ul>
<h3>5. 간편 앨범</h3>
<p><strong>입력:</strong> 사진 접근을 허용한 뒤 필터로 사진을 고릅니다.</p>
<ul><li>앨범 안에서: 하단 <strong>시스템 사진에서 추가</strong> → 시스템 선택기로 사진 선택; <strong>사진 추가</strong> → 시스템 사진을 시간 / 장소 / 유형으로 필터링한 뒤 선택한 사진을 앨범에 추가.</li><li>허용 → 시스템 사진 그리드를 읽을 수 있습니다.</li><li>시간 / 장소 / 유형 / 즐겨찾기 / 스크린샷 / 파노라마 / 연사 / 라이브 로 필터링 → 그리드가 일치하는 사진으로 좁혀집니다.</li>
<li>장소 검색에는 <strong>전 세계 5만 개 이상의 도시·지역</strong> 이름이 들어 있습니다(8개 언어가 서로 통일되어 중국어 이름도 현지 표기도 모두 검색됨). 도시명으로 찾지 못하면 <strong>도시 또는 주/도 이름</strong>으로 다시 시도하세요(예: 광둥성 / Guangdong, 하와이 / Hawaii). 표에 없는 지명은 Apple 지도에 한 번 더 조회하고, 그래도 없으면 원래 단어를 그대로 두며 추측하지 않습니다.</li><li>장소 인덱스의 지명은 Apple 지도(Apple Maps)가 좌표에서 생성합니다. Apple 지도 데이터의 제한으로 앱 언어를 프랑스어 등 중국어가 아닌 언어로 설정해도 중국 일부 지역의 지명이 중국어로 반환될 수 있습니다(앱 언어 설정이 적용되지 않은 것은 아닙니다). 이 경우 「장소(선택)」에서 영어 이름을 사용하거나 도시 이름(예: Guangzhou / 广州市)을 직접 입력한 뒤 다시 검색해 보세요.</li><li>사진 선택 → 앨범 만들기, 정렬, 슬라이드쇼 재생, 또는 슬라이드쇼 재생 중에 앨범을 MP4로 내보내기.</li><li>사진 참조와 메타데이터만 읽고 사진을 복사하거나 업로드하지 않습니다.</li><li>앨범 음성 → 「사진 찾기」 화면에서 음성 버튼을 누른 채 조건을 말하면(예: “2024년 8월 도쿄 사진”, “스크린샷만”, “최근 30일 동영상”) 그리드가 좁혀지고 해당 사진이 선택되며 「앨범 만들기」로 앨범이 됩니다. “이름은 바다”라고 말하면 앨범 이름을 지정할 수 있습니다(말하지 않으면 조건에 따라 자동으로 이름이 붙습니다). 음성은 기기에서만 인식됩니다.</li><li>중복 사진 찾기 → 앨범 상세에서 「중복 사진 찾기」를 누르면 비슷한 사진을 스캔해 그룹으로 묶습니다. 남길 것만 빼고 선택하고(길게 누르면 크게 보기) 「선택 삭제」를 누르면 한 번에 정리됩니다. 시스템 사진은 「최근 삭제된 항목」으로 가서 복구할 수 있습니다.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>「스크린샷」으로 필터링 → 스크린샷만 목록에 표시.</li><li>20장 선택 → 앨범 만들기 → 슬라이드쇼 재생 → 🎞(MP4로 내보내기) 탭 → 기기에 저장된 슬라이드쇼 영상.</li><li>앨범 → 중복 사진 찾기 → 남길 것만 빼고 선택 → 선택 삭제 → 중복 정리 완료(시스템 사진은 「최근 삭제된 항목」에서 복구 가능).</li><li>앱 언어가 프랑스어인데 지명이 중국어로 표시됨 → 「장소(선택)」에 Guangzhou 또는 广州市 입력 → 「검색」 탭.</li><li>도시명으로 찾지 못하면 → 주/도 이름으로 다시 검색(예: Guangdong, Hawaii) → 해당 지역 사진이 모여 표시됩니다.</li></ul>
<h3>6. 날씨와 경로(교통)</h3>
<p><strong>입력:</strong> 날씨를 엽니다(위치 사용). 경로는 출발지, 도착지, 이동 수단을 설정합니다.</p>
<ul><li>날씨 열기 → 현재 날씨와 예보(데이터는 Apple Weather, 조회 시 좌표 전송).</li><li>날씨 자동 갱신 → 3시간이 지나면 앱으로 돌아오거나 커버에 머무는 동안 자동으로 갱신됩니다(백그라운드에서는 갱신하지 않음). ↻를 누르면 수동 갱신: 교통 지도는 즉시 다시 그리고, 날씨는 1시간 이내면 캐시를 재사용합니다.</li><li>커버 지도 → 주변 교통 상황을 Apple 지도 색상으로 표시합니다. 두 메뉴로 반경과 자동 갱신 간격을 정하고, ⓘ 는 색상 설명, ↗ 는 Apple 지도에서 열기입니다. ETA를 설정하면 같은 지도가 경로 표시로 바뀝니다(선택한 경로는 자홍색, 대안은 짙은 파랑).</li><li>ETA 설정 → 출발지와 도착지(주소 검색 또는 현재 위치) + 이동 수단(차 / 도보 / 자전거) 선택 → 커버에 「16분 · 3.2 km」와 지도 경로(Apple 지도가 계산), 원활 / 서행 / 정체 판정, 「30분 후」 예측, 경로별 소요 시간 칩이 표시됩니다. 다른 칩을 누르면 경로가 바뀝니다.</li><li>ETA 조작 줄 → ⇅ 는 출발지와 도착지 교체(방향 고정), 🕘▾ 는 최근 경로, ✎ 는 편집, ↗ 는 Apple 지도에서 열기입니다. 자주 쓰는 경로는 즐겨찾기로 저장할 수 있습니다. 도착지 근처에 가면 경로가 자동으로 반대로 바뀌고 「반전됨」 배지가 표시됩니다.</li><li>교통 예측(📈) → 특정 경로의 당일 시간대별 소요 시간, 원활 / 서행 / 정체 시간대와 평균 소요 시간, 꺾은선 그래프와 시간별 상세를 보여 주며 Excel로 내보낼 수 있습니다. ETA를 설정하지 않아도 사용할 수 있습니다(즐겨찾기 또는 사용자 지정 경로 선택). 표시되는 시간은 Apple 지도 추정이 낙관적이어서 조금 높여 계산합니다. 사용자 지정 경로의 출발지/도착지는 「현재 위치」로 바로 설정할 수 있습니다.</li><li>커버 조언 → 코디 추천, 세부 알림, UV 경고(일몰 전 최고치), 기상 특보를 예보로 기기에서 계산합니다.</li></ul>

I18N["de"].privacy=`<h2>Datenschutzrichtlinie von PigPigPlan</h2>
<p class="meta">Gültig ab: Oktober 2026 · Plattformen: iOS / iPadOS / macOS · Version: v1.0</p>
<div class="callout"><strong>Kernversprechen.</strong> PigPigPlan ist eine lokale, datenschutzorientierte App für Finanzen und persönliche Datenverwaltung. Alle in der App erstellten Daten (einschließlich Gesundheitsdaten) werden ausschließlich auf Ihrem Gerät gespeichert und niemals auf einen Server hochgeladen. Exporte lösen immer Sie selbst aus. Die integrierte KI (Spracheingabe, natürlichsprachige Abfragen, Gesundheits-Q&amp;A, semantische Suche) läuft auf einem mitgelieferten kleinen Modell (ca. 0,8 Mrd. Parameter) vollständig auf Ihrem Gerät – ohne Internetverbindung. Die Spracherkennung erfolgt möglichst on-device; der erkannte Text wird ausschließlich on-device verarbeitet und nie auf unsere Server hochgeladen.</div>
<h3>1. Verarbeitete Daten</h3>
<p>Alle Daten werden von Ihnen eingegeben oder nach ausdrücklicher Autorisierung auf Ihrem Gerät gelesen:</p>
<table><tr><th>Kategorie</th><th>Inhalt</th><th>Quelle</th></tr>
<tr><td>Finanzen</td><td>Konten, Transaktionen, Tags, Budgets, Ratenpläne</td><td>Eingabe</td></tr>
<tr><td>Gesundheit</td><td>Herzfrequenz, HRV, Ruheherzfrequenz, Schlaf, Atmung, Blutsauerstoff, Körpertemperatur, Schritte, Workouts, Stimmung, Menstruationszyklus, Sonnenexposition</td><td>Apple Health (HealthKit), Einzelautorisierung</td></tr>
<tr><td>Inhalte</td><td>Fotos des einfachen Albums (inkl. Verweise auf Systemfotos)</td><td>Import / Aufnahme / autorisierter Fotozugriff</td></tr>
<tr><td>Einstellungen</td><td>Sprache, Design, Aktualisierungsintervall usw.</td><td>Lokal erzeugt</td></tr></table>
<p>Wir erfassen NICHT: Name, E-Mail, Telefon, Kontakte, Standort, Werbekennung (IDFA) usw.</p>
<h3>2. Speicherung und Verarbeitung</h3>
<ul>
<li><strong>100 % lokale Speicherung</strong>: Daten werden verschlüsselt (SQLCipher, AES-256) in einer lokalen Datenbank gespeichert.</li>
<li><strong>On-Device-KI</strong>: KI-Funktionen (natürlichsprachige Abfragen, Sprachnotizen, Gesundheits-Q&amp;A, semantische Suche) laufen vollständig auf einem kleinen integrierten Modell (ca. 0,8 Mrd. Parameter) auf Ihrem Gerät. Es werden weder Internetverbindung noch Apple Intelligence oder eine Cloud Dritter benötigt; Ihre Anfragen verlassen das Gerät nie.</li>
<li><strong>Sprache, Karten &amp; Gesundheit:</strong> Die Spracherkennung läuft möglichst on-device; die Album-Spracheingabe erfordert immer On-Device-Erkennung. Wenn Gerät oder Sprache dies nicht unterstützen, verarbeitet Apples Spracherkennungsdienst das Audio (Internet erforderlich); der erkannte Text wird nur on-device ausgewertet und nie auf unsere Server hochgeladen. Nur Wetter, Verkehrskarte, Routen (ETA), Verkehrsprognose und der Album-Ortsindex senden Daten an Apple (Koordinaten an Apple Weather, Stadtnamen über Apple Karten; die Verkehrskarte wird von Apple Karten gezeichnet; Start/Ziel werden für ETA und Verkehrsprognose von Apple Karten berechnet, wobei die Prognose je Zeitfenster des Tages eine geschätzte Fahrzeit abfragt; Foto-Koordinaten für den Ortsindex) – die Fotos selbst werden nie hochgeladen. Start/Ziel, Favoriten und zuletzt genutzte Routen aus der Startseite bleiben ausschließlich in den lokalen Einstellungen Ihres Geräts und werden nicht übertragen. Gesundheitsdaten werden nach Ihrer Freigabe gelesen; manuelle Einträge (auch per Sprache bestätigt) werden nach Ihrer Freigabe in Apple Health (HealthKit) geschrieben.</li>
<li><strong>Kein Server, kein Konto:</strong> Wir betreiben keine Server, die Ihre Daten empfangen; keine Registrierung erforderlich; keine Werbe-, Analyse- oder Tracking-SDKs Dritter. (Automatische Sicherungen liegen in <strong>Ihrem eigenen</strong> iCloud Drive, nicht auf unseren Servern.)</li>
<li><strong>Zweck</strong>: Daten dienen ausschließlich Ihren persönlichen Funktionen — Buchführung, Stressanalyse, semantische Suche, Fotoverwaltung.</li>
</ul>
<h3>3. HealthKit-Sondererklärung</h3>
<p>PigPigPlan liest Gesundheitsdaten über Apple HealthKit für die Stressanalyse (basierend auf HRV, Ruheherzfrequenz, Schlaf usw.) und Gesundheitstrends.</p>
<ul>
<li><strong>Autorisierung</strong>: Vor jedem Zugriff fragt das System Sie, jeden Datentyp einzeln zu erlauben;</li>
<li><strong>Umfang</strong>: Gesundheitsdaten werden lokal auf Ihrem Gerät verarbeitet, nur für die obigen Zwecke;</li>
<li><strong>Verbot</strong>: Wir verwenden sie nicht für Werbung, verkaufen sie nicht und geben sie nicht an Dritte weiter;</li>
<li><strong>Schreiben:</strong> Manuell eingegebene Gesundheitsdaten (auch per Sprache bestätigt) werden nach Ihrer Freigabe in Apple Health (HealthKit) geschrieben – nur für die erlaubten Typen. Ein Widerruf stoppt auch das Schreiben.</li>
<li><strong>Widerruf</strong>: Deaktivieren Sie die Autorisierung in der Health-App („Datenzugriff“) oder löschen Sie die App, um den Zugriff sofort zu beenden.</li>

<h3>4. Export von Daten</h3>
<p>Sie behalten die volle Kontrolle über Ihre Daten. Exporte werden immer von Ihnen ausgelöst:</p>
<ul>

<li>Exportierbare Daten: Finanzaufzeichnungen, Gesundheitsanalysen, Albumfotos;</li>
<li>Exporte dienen nur Ihrer persönlichen Sicherung, Migration oder Analyse und werden niemals automatisch an Dritte gesendet;</li>
<li>Diese App bietet keinen Dritt-API-Zugriff auf Ihre Daten.</li>

<h3>5. Datensicherheit</h3>

<h3>6. Aufbewahrung und Löschung</h3>

<tr><td>Gesundheitsautorisierung deaktivieren</td><td>Die App liest diesen Datentyp sofort nicht mehr</td></tr></table>
<h3>7. Datenschutz für Kinder</h3>
<p>Die App richtet sich nicht an Kinder unter 13 Jahren und erfasst deren personenbezogene Daten nicht wissentlich.</p>
<h3>8. Dienste Dritter</h3>
<p>Es sind keine Werbe-, Analyse- oder Tracking-Dienste Dritter integriert. Einzige Abhängigkeiten: Apple HealthKit / SwiftUI / MLX / WeatherKit (Apple-Frameworks, vollständig auf dem Gerät) und lokale Open-Source-Bibliotheken (SQLite usw.).</p>
<h3>9. Änderungen und Kontakt</h3>
<p>Änderungen werden auf dieser Seite mit Gültigkeitsdatum veröffentlicht. Bei Fragen kontaktieren Sie uns über die Seite „Über“ in der App oder die Entwicklerkontaktdaten im App Store.</p>
<h3>10. Internet erforderlich für</h3>
<p>Wetter, Verkehrskarte, Routen (ETA) und Verkehrsprognose, Kauf/Wiederherstellung des Abos sowie der erste Download von Sprachpaketen für die „übersetzungsgestützte Suche“ im Album benötigen Internet. Es werden nur die nötigsten Informationen gesendet – Ihre Koordinaten an Apple Weather (der Stadtname wird über Apple Karten ermittelt), die Verkehrskarte fragt Karteninhalte bei Apple Karten ab, Start/Ziel gehen für ETA und Verkehrsprognose an Apple Karten (Berechnung von Route und Fahrzeit), und Foto-Koordinaten an Apple Karten, um Ortsnamen für den Album-Ortsindex zu ermitteln; ohne personenbezogene Daten. Alle anderen Funktionen (Buchhaltung, Gesundheitsanalyse, Spracherkennung bei unterstützter On-Device-Erkennung, semantische Abfragen) funktionieren offline.</p>
<h3>11. Systemfotos und Foto-Organisation</h3>
<p>Beim Organisieren deiner Systemfotos liest die App über PhotoKit nur Referenz-IDs und Metadaten (Aufnahmezeit, Ort, Typ); sie kopiert und lädt deine Fotos nicht hoch. Auf dem Gerät erzeugte Analyse-Labels (Szenen, Text) liegen nur in der lokalen verschlüsselten Datenbank und können in der App jederzeit gelöscht werden. Die App nutzt keine „Personen und Tiere“-Gruppierung und führt keine Gesichtserkennung durch. Für den Ortsindex sendet die App Foto-Koordinaten (nie die Fotos selbst) an Apple Karten, um Ortsnamen zu ermitteln; nur der zurückgegebene Ortsname wird in der lokalen verschlüsselten Datenbank gespeichert.</p>
<h3>12. Lokale Sicherung &amp; Wiederherstellung</h3>
<p>Unter „Einstellungen → Sicherung“ können Sie Ihre eigene Sicherungsdatei exportieren und wiederherstellen.</p>
<ul>
<li>Die Sicherung enthält <strong>nur</strong> die Geschäftsdaten in Ihrer lokalen verschlüsselten Datenbank: Finanzdaten, Albenlisten, Einstellungen usw. Der Suchindex (einschließlich der auf dem Gerät aus Fotos, Gesundheitszusammenfassungen usw. erzeugten Vektorindizes) liegt in einer separaten Vektordatenbank und ist <strong>nicht Teil der Sicherung</strong>; er wird nach der Wiederherstellung auf dem Gerät neu aufgebaut.</li>
<li>Die Sicherung enthält <strong>keine Gesundheitsdaten</strong> (weder aus Apple Health gelesene Messwerte noch die auf dem Gerät berechnete Stressanalyse). Diese Daten werden stets von Apples „Health“-App verwahrt; nach erneuter Freigabe auf einem neuen Gerät werden sie automatisch erneut synchronisiert – eine Kopie ist weder nötig noch sinnvoll.</li>
<li>Die Sicherung enthält <strong>keine</strong> Fotodateien; nach einem Gerätewechsel können Sie sie in der Systemfotomediathek erneut auswählen oder neu importieren.</li>
<li>Wir können und werden Ihre Daten nicht auf <strong>unsere</strong> Server hochladen (kein Konto, kein Server). Die App markiert ihr Datenbankverzeichnis als vom iCloud-Backup ausgenommen. Zusätzlich wird eine automatische Sicherungskopie nur der Datenbank (<strong>ohne Fotos, ohne Gesundheitsdaten</strong>) über iCloud-Dokumente in <strong>Ihrem eigenen</strong> iCloud Drive gespeichert, sodass sie auch nach dem Löschen oder Neuinstallieren der App wiederhergestellt werden kann. Unter „Einstellungen → Sicherung“ können Sie weiterhin manuell exportieren.</li>
</ul>

I18N["de"].guide=`<h2>PigPigPlan Anleitung</h2>
<p class="meta">Alles läuft auf Ihrem Gerät — kein Konto nötig. Jeder Abschnitt zeigt <strong>Eingabe → Ausgabe</strong> und konkrete <strong>Beispiele</strong>.</p>
<h3>1. Erster Start</h3>
<p><strong>Eingabe:</strong> nichts — App einfach öffnen.</p>
<ul><li>App öffnen → eine lokale verschlüsselte Datenbank wird automatisch angelegt (keine Registrierung).</li><li>Danach sehen Sie die Startseite mit den Tabs: Finanzen, Gesundheit, Alben sowie Werkzeuge / Persönlich / Einstellungen.</li><li>Auf der Startseite werden außerdem dauerhaft angezeigt: Wetter (aktuelles Wetter, Vorhersage, Outfit- und UV-Empfehlungen &ndash; Daten von Apple Weather), die Verkehrskarte (Menüs für Umkreis und automatische Aktualisierung, ⓘ Farblegende, ↗ in Karten öffnen) sowie ETA &amp; Verkehrsprognose (⏱ ETA festlegen, 🕘▾ letzte Routen, 📈 Stundenprognose für heute) &ndash; siehe Abschnitt 6.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Erste Installation auf einem neuen Gerät → Datenbank initialisiert, Startseite erscheint.</li><li>App später erneut öffnen → Ihre bisherigen Daten sind bereits da.</li></ul>
<h3>2. Startseite &amp; Navigation</h3>
<p><strong>Eingabe:</strong> einen Tab, die Krone 👑 oder ⚙️ antippen.</p>
<ul><li>Tab antippen → das jeweilige Modul öffnet sich.</li><li>👑 auf der Startseite antippen → die Abo-Seite (Pro) öffnet sich.</li><li>⚙️ antippen → Einstellungen öffnen sich (Sprache, Design, Aktualisierungsintervall, Daten).</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>„Gesundheit“ antippen → das Dashboard mit Ihren Werten.</li><li>⚙️ antippen → Einstellungen → Sprache auf Deutsch ändern.</li></ul>
<h3>3. Finanzen</h3>
<p><strong>Eingabe:</strong> Betrag, Tag, Datum, Notiz (eintippen oder einen Satz sprechen).</p>
<ul><li>Konto anlegen und eine Transaktion hinzufügen → sie erscheint in der Liste; Summen und Diagramme aktualisieren sich sofort.</li><li>Spracheingabe → Mikrofon antippen und sprechen → eine Bestätigungskarte erscheint → „Bestätigen“ zum Speichern.</li><li>Unvollständiger Satz → die Bestätigungskarte öffnet trotzdem, vorausgefüllt mit dem Verstandenen (Betrag / Tag / Datum / Notiz): Fehlendes ergänzen, Falsches korrigieren, dann „Bestätigen“ zum Speichern. Wird gar kein Betrag erkannt, bittet die App darum, es erneut zu sagen.</li><li>Ratenzahlung → „Auto, 30 Raten, je 1300“ sagen → das Eingabefenster füllt Gesamtbetrag 39000 / 30 Raten / 1300 pro Rate; bei 36 Raten wird der Gesamtbetrag auf 46800 aktualisiert, 1300 pro Rate bleibt.</li><li>Budget festlegen (Tag + Zeitraum + Betrag) → dieser Tag zeigt einen Fortschrittsbalken „ausgegeben / Budget“.</li><li>In natürlicher Sprache fragen → gefilterte Ergebnisse (on-device berechnet).</li><li>Planfragen → fragen Sie, ob eine Rate noch fällig ist (z. B. „Muss ich im Juli noch das Handy zahlen“) → bei Ratenplänen zeigt die Plankarte zusätzlich N/M bezahlt, R Raten übrig und den noch fälligen Restbetrag; normale Ausgabenfragen bleiben Transaktionsabfragen.</li><li>Datenschutzmodus → Beträge werden standardmäßig als ****** ausgeblendet; tippen Sie oben auf die 👁️-Schaltfläche „Zahlen anzeigen / ausblenden“, um die echten Beträge zu sehen (erneut tippen zum Ausblenden).</li><li>Diagramme &amp; Berichte → Ausgabenverteilung (Kreis), Kategorie-Balkendiagramm, Einnahmen/Ausgaben-Trend, Kategorie-Ausgabentrend, Kategorie-Ranking und Periodenvergleich — alles on-device berechnet.</li><li>Sprachabfrage → Mikrofon antippen und eine Frage sprechen (z. B. „wie viel habe ich diesen Monat für Essen ausgegeben“) → die Antwort wird on-device berechnet.</li><li>Mehrere Konten → Konten anlegen, löschen und wechseln; jedes führt eigene Summen und Diagramme.</li><li>Benutzerdefinierte Abfrage → mehrere Konten, Titel-/Notiz-Stichwort, mehrere Tags und Zeitraum kombinieren, Ergebnisse seitenweise.</li><li>Planverwaltung → Ratenpläne/Abos pausieren, fortsetzen, kündigen oder die aktuelle Periode als bezahlt markieren; jede Aktion fragt vorher nach.</li><li>Nach dem Erfassen bearbeiten oder löschen → jede Zeile der Kontoliste hat „✎ Bearbeiten“ und „🗑 Löschen“ (unter iOS auch nach links wischen zum Löschen, Langdruck öffnet ein Menü „Bearbeiten / Löschen“); ein Suchergebnis öffnet per Tippen die Detailansicht im Vollbild, dort lässt es sich bearbeiten oder löschen. Vor jedem Löschen kommt eine Bestätigung.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>„Mittagessen 35“ sagen → eine offene Karte „Ausgabe 35 · Essen“.</li><li>„Budget Supermarkt 2000 monatlich“ sagen → ein monatliches Supermarkt-Budget von 2000.</li><li>„wie viel habe ich diesen Monat für Essen ausgegeben“ eintippen → die Essen-Summe dieses Monats.</li><li>„Muss ich im Juli noch das Handy zahlen“ eingeben → die Plankarte zeigt die Rate des Monats, verbleibende Raten und den Restbetrag.</li></ul>
<h3>4. Gesundheit</h3>
<p><strong>Eingabe:</strong> die gewünschten Gesundheitstypen freigeben, dann einen Wert öffnen; Spracheingabe geht auch.</p>
<ul><li>Tab Gesundheit öffnen und Typen freigeben → Karten für Herzfrequenz, HRV, Schlaf, Workouts, Körpertemperatur, Blutsauerstoff, Schritte, Stimmung und mehr.</li><li>Health-Zugriffsfenster → alle gewünschten Punkte einschalten und dann <strong>ganz nach unten scrollen</strong> und „Erlauben“ antippen – die Bestätigung steht am Ende der Liste und ist ohne Scrollen nicht sichtbar.</li><li>Stress öffnen → ein Stresswert aus HRV / Ruheherzfrequenz / Schlaf, on-device berechnet.</li><li>Mikrofon antippen und einen Wert sagen → ein offener Eintrag zum Bestätigen.</li><li>Unvollständiger Satz → die Karte zum Bestätigen öffnet trotzdem, vorausgefüllt mit dem Verstandenen (Messwert / Wert / Zeit): Fehlendes ergänzen, Falsches korrigieren, dann „Bestätigen“ zum Speichern. Wird nichts als Gesundheitseintrag erkannt, zeigt die App einen Beispielsatz.</li><li>Sprach- / natürlichsprachliche Abfrage → fragen Sie „an welchen Tagen war der Stress am höchsten“ → wird auf Stress- / Schlaf- / Workout-Daten geroutet und on-device berechnet.</li><li>Trenddiagramme → Gesamtgesundheitstrend (Stress / HRV / Ruheherzfrequenz / Schlaf) und Stimmungstrend; den Bericht als Excel exportieren.</li><li>Gesundheits-Q&amp;A → „Wie war mein Schlaf diese Woche?“ oder „An welchen Tagen war der Stress am höchsten?“ → on-device aus Ihren Gesundheitsdaten beantwortet.</li><li>Meine Einträge → einen Eintrag antippen, um die Bestätigungskarte erneut zu öffnen und Wert / Zeit / Workout-Typ zu korrigieren und zu speichern (die zurückgeschriebene Kopie in Apple Health wird mitaktualisiert); nach links wischen löscht – dabei verschwinden der lokale Eintrag und seine Kopie in „Health“.</li><li>Selbst gemeldetes Workout → Datum + Workout-Typ + Dauer + optional verbrannte Kalorien werden zusammen erfasst; Kalorien werden nur geschrieben, wenn Sie sie nennen (nie geschätzt).</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Herzfrequenz &amp; Schlaf freigeben → Ruhepuls von heute und Schlaf der letzten Nacht.</li><li>„Blutdruck 120 80“ sagen → ein offener Blutdruck-Eintrag.</li><li>„Gewicht 68“ sagen → ein offener Körpergewicht-Eintrag.</li><li>„Kopfschmerzen und die Schulter tut auch weh“ sagen → erzeugt zwei Entwürfe auf einmal.</li><li>„Gestern 30 Min gelaufen, 280 kcal verbrannt“ sagen → erfasst „Datum gestern + Typ Laufen + 30 Min + 280 kcal“; in „Meine Einträge“ antippen, um Typ, Dauer oder Kalorien zu ändern.</li></ul>
<h3>5. Einfaches Album</h3>
<p><strong>Eingabe:</strong> Fotozugriff freigeben, dann Fotos mit einem Filter auswählen.</p>
<ul><li>Im Album: unten „Aus Systemfotos hinzufügen“ → Fotos mit der Systemauswahl picken; „Fotos hinzufügen“ → Systemfotos nach Zeit / Ort / Typ filtern und die ausgewählten ins Album aufnehmen.</li><li>Zugriff freigeben → das Systemfotos-Raster ist lesbar.</li><li>Nach Zeit / Ort / Typ / Favoriten / Screenshots / Panorama / Serienbild / Live filtern → das Raster zeigt nur passende Fotos.</li>
<li>Die Ortssuche enthält <strong>über 50.000 Städte und Regionen weltweit</strong> (die 8 App-Sprachen greifen wechselseitig, chinesische wie lokale Schreibweise funktionieren); wird eine Stadt nicht gefunden, versuchen Sie den <strong>Stadt- oder Provinz-/Bundesstaatsnamen</strong> (z. B. Guangdong / 广东省, Hawaii). Namen, die nicht in der Tabelle stehen, werden einmal zusätzlich über Apple Maps gesucht; bleibt auch das erfolglos, bleibt das Wort unverändert stehen — die App rät nicht.</li><li>Ortsnamen im Ortsindex werden von Apple Maps aus Koordinaten erzeugt. Aufgrund der Datenbeschränkungen von Apple Maps können einige Orte in China auch dann noch auf Chinesisch zurückgegeben werden, wenn die App auf Französisch oder eine andere nicht-chinesische Sprache eingestellt ist (das bedeutet nicht, dass die Spracheinstellung der App nicht wirkt). Versuchen Sie in diesem Fall im Feld „Ort (optional)“ einen englischen Namen oder geben Sie den Stadtnamen direkt ein (z. B. Guangzhou / 广州市) und suchen Sie erneut.</li><li>Fotos auswählen → Album erstellen, sortieren, Diashow abspielen — oder das Album während der Diashow als MP4 exportieren.</li><li>Es werden nur Foto-Referenzen und Metadaten gelesen — Fotos werden nie kopiert oder hochgeladen.</li><li>Album-Sprache → auf dem Bildschirm „Fotos finden“ die Sprechtaste halten und Bedingungen sagen (z. B. „Tokio-Fotos von August 2024“, „nur Screenshots“, „Videos der letzten 30 Tage“) → das Raster wird eingegrenzt und die Treffer werden vorausgewählt, dann „Album erstellen“ antippen; mit „heißt Strand“ legen Sie den Albumnamen fest (sonst wird nach den Bedingungen benannt). Sprache wird nur on-device erkannt.</li><li>Duplikate finden → im Album „Duplikate finden“ antippen: ähnliche Fotos werden gescannt und gruppiert, die überzähligen anhaken (Langdruck für die große Ansicht) und „Auswahl löschen“ antippen — Duplikate verschwinden auf einmal; Systemfotos landen in „Zuletzt gelöscht“ und lassen sich wiederherstellen.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Filter „Screenshots“ → nur Screenshots werden gelistet.</li><li>20 Fotos auswählen → Album erstellen → Diashow abspielen → 🎞 (MP4 exportieren) antippen → ein Diashow-Video auf Ihrem Gerät.</li><li>Album → Duplikate finden → überzählige anhaken → Auswahl löschen → Duplikate weg (Systemfotos lassen sich aus „Zuletzt gelöscht“ wiederherstellen).</li><li>App-Sprache ist Französisch, ein Ort wird aber noch auf Chinesisch angezeigt → im Feld „Ort (optional)“ Guangzhou oder 广州市 eingeben → „Suchen“ antippen.</li><li>Eine Kleinstadt liefert nichts → stattdessen die Provinz / den Bundesstaat eingeben (z. B. Guangdong, Hawaii) → die Fotos dieser Region werden angezeigt.</li></ul>
<h3>6. Wetter &amp; Route (Verkehr)</h3>
<p><strong>Eingabe:</strong> Wetter öffnen (nutzt Ihren Standort); für eine Route Start, Ziel und Verkehrsmittel festlegen.</p>
<ul><li>Wetter öffnen → aktuelle Bedingungen und Vorhersage (Daten von Apple Weather; beim Abruf werden Ihre Koordinaten gesendet).</li><li>Wetter aktualisiert sich automatisch → nach 3 Stunden beim Zurückkehren in den Vordergrund oder während Sie auf dem Cover bleiben (im Hintergrund wird nicht aktualisiert); ↻ aktualisiert manuell — die Verkehrskarte wird sofort neu gezeichnet, das Wetter nutzt innerhalb 1 Stunde den Cache.</li><li>Karte auf dem Cover → Verkehr in der Umgebung in Apple-Maps-Farben; die beiden Menüs legen Radius und Aktualisierungsintervall fest, ⓘ erklärt die Farben, ↗ öffnet die Stelle in Apple Maps. Sobald eine ETA gesetzt ist, zeigt dieselbe Karte Ihre Route (aktuelle Variante magenta, Alternativen dunkelblau).</li><li>ETA festlegen → Start und Ziel (Adresssuche oder aktueller Standort) + Modus (Auto / Fuß / Fahrrad) → das Cover zeigt „16 Min. · 3,2 km“ und die Route auf der Karte (von Apple Maps berechnet), die Bewertung Frei / Mäßig / Dicht, eine Schätzung „in 30 Minuten“ und Chips mit den Varianten; ein anderer Chip schaltet die Route um.</li><li>ETA-Zeile → ⇅ tauscht Start und Ziel und fixiert die Richtung, 🕘▾ zeigt die zuletzt genutzten Routen, ✎ bearbeitet, ↗ öffnet in Apple Maps; Favoriten lassen sich für später speichern. In der Nähe des Ziels dreht sich die Route automatisch um und zeigt ein Badge „umgekehrt“.</li><li>Verkehrsprognose (📈) → stündliche Fahrzeit einer Route über den Tag, die Zeitfenster Frei / Mäßig / Dicht mit Durchschnittszeit, ein Diagramm plus Stunden-Details, als Excel exportierbar; funktioniert auch ohne ETA (Favorit oder eigene Route wählen). Die Zeiten sind leicht erhöht, da Apple Maps meist optimistisch schätzt; bei einer eigenen Route lassen sich Start/Ziel direkt über „Aktueller Standort“ setzen.</li><li>Cover-Empfehlung → Outfit-Empfehlung, Detailhinweise, UV-Warnung (Peak vor Sonnenuntergang) und Wetterwarnung, on-device aus der Vorhersage berechnet.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Wetter öffnen → heutige Temperatur und 7-Tage-Vorhersage.</li><li>Über 3 Stunden auf dem Cover bleiben oder nach 3 Stunden im Hintergrund zurückkehren → das Wetter aktualisiert sich automatisch, ohne ↻.</li><li>Zuhause → Büro, Modus „Auto“ → Distanz, Dauer und Route auf der Karte.</li><li>Modus auf „Fuß“ umstellen → die ETA wird für Fußweg aktualisiert.</li><li>„Verkehrsprognose“ öffnen → die Stoßzeiten morgens/abends sind am langsamsten; später losfahren → die ETA sinkt.</li><li>Ohne ETA auf 📈 tippen → „Eigene Route“ wählen → die Prognose für heute stündlich erstellen → als Excel exportieren.</li><li>Einen anderen Fahrzeit-Chip tippen → die Karte wechselt zur Alternative.</li><li>Abends zum Büro zurücklaufen → die Route dreht sich automatisch zu „Büro → Zuhause“.</li></ul>
<h3>7. Suche</h3>
<p><strong>Eingabe:</strong> ein Stichwort, eine Frage oder ein Sprachbefehl — jedes Modul durchsucht nur seine eigenen Daten.</p>
<ul><li>Finanzen → in natürlicher Sprache fragen („wie viel für Essen diesen Monat“), eine eigene Abfrage starten (Konten + Stichwort + Tags + Zeitraum) oder einen Planbefehl geben (pausieren / fortsetzen / kündigen / Periode als bezahlt markieren → zuerst Bestätigungskarte).</li><li>Gesundheit → nach eigenen Gesundheitsdaten fragen („an welchen Tagen war der Stress am höchsten“, „wie war mein Schlaf diese Woche“) → on-device berechnet und beantwortet.</li><li>Album → nach Zeit / Ort / Typ filtern oder Sprachbefehle nutzen; Ortsnamen können zusätzlich über Apple Übersetzen auf Englisch abgeglichen werden (Sprachpaket beim ersten Mal herunterladen).</li><li>Alle Auswertungen und Berechnungen erfolgen on-device; Anfragen und Ergebnisse werden nicht hochgeladen.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>„Verkehr letzten Monat“ eintippen → passende Finanz-Einträge mit Summe.</li><li>„wie war mein Schlaf diese Woche“ fragen → Antwort aus Ihren Schlafdaten, on-device.</li><li>„Fotos aus Seoul vom letzten Jahr“ sagen → das Album-Raster zeigt nur diese Fotos.</li></ul>
<h3>8. Abo (Pro)</h3>
<p><strong>Eingabe:</strong> einen Tarif antippen (monatlich / jährlich), „Kauf wiederherstellen“ oder „Abo verwalten“.</p>
<ul><li>Tarif antippen → das Apple-Kaufblatt erscheint → bestätigen → alle Funktionen werden freigeschaltet.</li><li>„Kauf wiederherstellen“ antippen → ein früherer Kauf wird wiederhergestellt (Internet nötig).</li><li>„Abo verwalten“ antippen → auf Apples Seite ändern oder kündigen; die Abrechnung erfolgt durch Apple.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>„Jährlich“ antippen → im Apple-Blatt bestätigen → Pro freigeschaltet.</li><li>„Kauf wiederherstellen“ antippen → ein früheres Abo wird wiederhergestellt.</li><li>„Abo verwalten“ antippen → Apples Abo-Seite öffnet sich.</li></ul>
<h3>9. Einstellungen &amp; Sprache</h3>
<p><strong>Eingabe:</strong> eine Sprache, ein Design oder eine Datenaktion wählen.</p>
<ul><li>Sprache / Design / Aktualisierungsintervall ändern → die Oberfläche aktualisiert sich sofort.</li><li>Daten löschen / Berechtigungen verwalten / exportieren → der passende Bildschirm öffnet sich.</li><li>Plattform &amp; Sprachen → iOS / iPadOS / macOS, 8 UI-Sprachen, Themes, Dynamic Type und Datenschutzmodus (Beträge als ******).</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Sprache auf Englisch stellen → die ganze App wechselt sofort.</li><li>Auf dunkles Design wechseln → die Farben ändern sich sofort.</li></ul>
<h3>10. Export &amp; Backup</h3>
<p><strong>Eingabe:</strong> wählen, was exportiert wird (Finanzen / Gesundheitsanalyse / Album).</p>
<ul><li>Exportieren → eine Datei (Excel .xlsx) wird erzeugt und auf Ihrem Gerät oder iCloud Drive gespeichert.</li><li>Exporte lösen immer Sie selbst aus; nichts wird automatisch gesendet.</li><li>Automatische Sicherung → bei Datenbankänderungen wird eine Sicherung erstellt, mit Hinweis „letzte Sicherung vor N Tagen“; die Wiederherstellung führt zusammen (nur hinzufügen).</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Finanzen dieses Monats exportieren → eine .xlsx-Datei in „Dateien“.</li><li>Ein Album exportieren → Fotos werden an den gewählten Ort geschrieben.</li></ul>
<h3>11. Berechtigungen &amp; Datenschutz</h3>
<p><strong>Eingabe:</strong> eine Berechtigung in den Systemeinstellungen umschalten oder die App löschen.</p>
<ul><li>Gesundheit → jederzeit in der Health-App unter „Datenzugriff &amp; Geräte“ widerrufen.</li><li>Fotos → Einstellungen → Datenschutz &amp; Sicherheit → Fotos widerrufen.</li><li>Mikrofon / Spracherkennung → in Einstellungen → Datenschutz &amp; Sicherheit widerrufen.</li><li>App löschen → alle lokalen Daten werden entfernt (vorher exportieren).</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Fotos in den Einstellungen widerrufen → das Album-Raster kann keine neuen Fotos mehr lesen.</li><li>Die App löschen → lokale Datenbank weg; die App ist zurückgesetzt.</li></ul>`;
