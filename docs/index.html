<style>
:root{--bg:#fff;--fg:#1c1c1e;--muted:#6b7280;--line:#e5e7eb;--brand:#0a84ff;--card:#f7f8fa;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0d;--fg:#e8e8ea;--muted:#9ca3af;--line:#2a2a2e;--card:#17171a;--brand:#3b9dff}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--fg)}
a{color:var(--brand)}
h1,h2,h3{letter-spacing:-.01em}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;min-height:60px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;text-decoration:none;color:var(--fg);flex:0 0 auto}
.brand img{height:28px;width:auto;display:block}
.nav{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto;font-size:14px}
.nav a{color:var(--muted);text-decoration:none}
.nav a:hover{color:var(--fg)}
.langsel{font:inherit;font-size:14px;font-weight:500;cursor:pointer;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;flex:0 0 auto}
.langsel:empty{display:none}
@media(max-width:760px){.nav{display:none}}
.hero{padding:54px 0 10px;display:grid;grid-template-columns:1.12fr .88fr;gap:36px;align-items:center}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:34px;gap:24px}}
.badge{display:inline-block;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card)}
h1{font-size:38px;line-height:1.24;margin:14px 0 12px}
@media(max-width:760px){h1{font-size:29px}}
.lead{font-size:17px;color:var(--muted);margin:0 0 22px;max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn[aria-disabled="true"]{cursor:default}
.soon{font-size:13px;color:var(--muted);margin:12px 0 0}
.hero .shot{margin:0;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--card);box-shadow:0 18px 40px rgba(0,0,0,.12)}
section{padding:46px 0;border-top:1px solid var(--line);scroll-margin-top:70px}
h2{font-size:26px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px;font-size:15px}
.mod{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:26px;align-items:start;padding:22px 0;border-top:1px dashed var(--line)}
.mod:first-of-type{border-top:0;padding-top:4px}
@media(max-width:640px){.mod{grid-template-columns:1fr;gap:14px}}
.mod h3{margin:0 0 8px;font-size:19px}
.mod ul{margin:0;padding-left:20px}
.mod li{margin:.35em 0}
.shot{margin:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.shot img{display:block;width:100%;height:auto}
.shot figcaption{font-size:12px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line)}
.callout{background:var(--card);border-left:4px solid var(--brand);padding:14px 16px;border-radius:10px;margin:0}
.callout strong{display:block;margin-bottom:4px}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:560px){.plans{grid-template-columns:1fr}}
.plan{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--card)}
.plan h3{margin:0 0 6px;font-size:16px;color:var(--muted);font-weight:600}
.price{font-size:26px;font-weight:700;margin:0 0 4px}
.plan .note{font-size:13px;color:var(--muted);margin:0}
.fine{font-size:13px;color:var(--muted);margin:16px 0 0}
details{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--card)}
summary{cursor:pointer;font-weight:600;list-style:none;padding-right:20px;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:0;top:0;color:var(--muted);font-weight:400}
details[open] summary::after{content:"–"}
details p{margin:10px 0 0;color:var(--muted);font-size:15px}
.support{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:start}
@media(max-width:640px){.support{grid-template-columns:1fr}}
.links{display:flex;flex-direction:column;gap:10px;font-size:15px}
.links b{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
footer{border-top:1px solid var(--line);padding:26px 0 44px;color:var(--muted);font-size:13px;margin-top:10px}
footer .frow{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.badge.ai{color:var(--brand);border-color:var(--brand)}
.aiband{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:16px;padding:24px 24px 18px;margin:26px 0 0;scroll-margin-top:70px}
.aiband h2{margin:0 0 6px}
.aiband ol{margin:16px 0 0;padding-left:22px}
.aiband li{margin:.5em 0}
.aiband .fine{margin-top:14px}
.demo{margin:18px 0 0;border-top:1px dashed var(--line);padding-top:14px}
.demo>b{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
.ditem{margin:10px 0}
.ditem .said{margin:0;font-weight:600}
.ditem .got{margin:2px 0 0;color:var(--brand);font-size:14px}
.rlist{margin:0;padding-left:22px}
.rlist li{margin:.45em 0}
.dev{margin:24px 0 0}
.dev h3{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:0}
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:640px){.strip{grid-template-columns:1fr}}
.strip .shot{background:var(--card)}
.strip .shot.wide{grid-column:span 2}
@media(max-width:640px){.strip .shot.wide{grid-column:span 1}}
.strip .shot img{display:block;width:100%;height:auto}
.mod .goal{font-size:14px;font-weight:600;margin:0 0 8px}
.modnote{font-size:13px;color:var(--muted);margin:16px 0 0}
#about .aboutp{font-size:15px;color:var(--muted);margin:12px 0 0;line-height:1.75}
</style>
</head>

MKT["en"]={
  meta:{title:"PigPigPlan — money, health and photos, all on your device",
        desc:"A local-first app for finance, health and photos. Voice entry, natural-language queries and on-device AI. No account, no server, no tracking."},
  ui:{lang:"Language",soon:"Coming soon",notify:"Email me when it’s out",
      nav:{features:"Features",privacy:"Privacy",pricing:"Pricing",faq:"FAQ",support:"Support",ai:"AI",reports:"Reports",screens:"Screenshots",about:"About"}},
  hero:{badge:"iPhone · iPad · Mac",
        title:"Money, health and photos — all on your device.",
        sub:"Speak to record an expense, ask your own health data a question, and build photo albums by voice. One app: no account, no server, no tracking.",
        cta:"Coming soon",
        ctaNote:"Not on the App Store yet. Leave your email and we’ll tell you when it ships.",
        aiNote:"Built-in AI · runs on your device"},
  modulesTitle:"What it does",
  modulesSub:"Three tools that share one encrypted database on your device.",
  ai:{title:"Your phone’s chip does the listening.",
    lead:"No cloud, no GPU farm. A 0.8B-parameter model ships inside the app and runs on the Apple silicon in your iPhone or iPad — the same chip that drives your games and video.",
    points:[
      "Bundled, not downloaded: the model is inside the app (4-bit, ~620 MB), so the very first answer needs no account, no setup and no connection.",
      "AI in airplane mode: parsing your sentence, searching your albums and answering health questions all happen on the device — no request ever leaves it.",
      "All that headroom, spent on you: today’s phone chips are fast enough to run a language model in your hand, so there is no queue, no call limit and no server bill to pass on."],
    footnote:"Speech-to-text runs on the device whenever the system supports it; if it does not, Apple’s speech service handles the audio and only the recognised text is parsed locally."},
  demo:{label:"Even sentences like these:",items:[
    {said:"Bought a phone on the 12th last month for 5,999, 24 instalments, trade-in 300 off the last one",

    lead:"Queries are not just filters: trend, share, totals, budget gaps, period-to-period comparisons and Top-N come back as cards — ready to read, ready to export.",
    points:[
      "Trend · share · totals · budget gap · comparison · Top-N — asked in one sentence and delivered as cards, not a spreadsheet you have to count yourself.",
      "One-tap Excel: charts on top, notes in the middle, data below, so the file still makes sense to someone else.",
      "Subscription lists, instalment schedules and health trends export the same way, with the same fields you see in the app.",
      "Everything is computed on the device; the exported file goes wherever you save it — your device or iCloud Drive."],
    footnote:"Reports are built from the records and health summaries on your device. No cloud compute is involved."},

    devices:[
      {key:"promax",name:"iPhone Pro Max",shots:[

        {v:"open_portrait",label:"Open · Portrait"},{v:"open_landscape",label:"Open · Landscape"}]}]},
  modules:[
    {key:"finance",name:"Finance",goal:"Goal: record and query in everyday language, and turn the answer straight into a general-purpose report.",points:[
      "Voice entry for both spending and income: say “lunch 32” or “YouTube channel subscription income 200”, and the amount, tag and date are filled in for you to confirm.",
      "Ask in plain language — “how much did I spend on dining this month?” or “how much subscription income this year?” — and the answer is computed from your own records, on the device.",

    {key:"health",name:"Health",goal:"Goal: be the data companion for Apple Watch and Apple Health — read it well, and write records back.",points:[
      "Reads only the categories you authorise (workouts, steps, stand hours, heart rate, HRV, respiratory rate, sleep, body temperature, blood oxygen, weight and more) and computes trends, extremes and averages on the device; fixed reports are one tap away.",

  ],
  modulesNote:"All three share one encrypted database on your device: no server, no ads, no sign-up, and no third-party analytics SDK.",
  about:{title:"About the makers",lead:"A small group of developers with years of experience building systems for international financial companies.",paragraphs:["We are a group of developers with many years of experience building systems for international financial companies. Our wish is to build software independently that genuinely improves people’s lives. From years of working on financial systems, we have learned something more directly than most: privacy is not one item on a feature list — it is the floor and the starting point of every experience. Without respect for user data, nothing else holds up.","That is why we made a few choices that were not easy. All user data is encrypted and processed only on your phone or iPad; everyday use needs no internet and no token. The only thing that can leave the device is the minimal encrypted backup you turn on yourself, and it is stored only in your own iCloud. We added on-device AI to improve how you enter and query data — not to trade data away for convenience.","We know this is hard to do offline, and not something you finish in a day. We are willing to keep at it, because we want to hand control of the data back to you. Whether the result deserves your trust is something only you can judge — and we are very glad to follow up on your feedback and improve."]},
  privacy:{title:"Privacy by design",sub:"No account. No server. No tracking.",label:"Core commitment",
    body:"PigPigPlan is a privacy-first, local-first finance & personal data app. All data you create (including health data) stays on your device and is never uploaded to any server; exports are always initiated by you. The built-in AI (voice cleanup, natural-language queries, health Q&A, semantic search) runs entirely on-device on a small model bundled with the app (~0.8B parameters) and needs no internet; speech-to-text is performed on-device whenever supported, and recognised text is parsed only locally and never uploaded to our servers."},

    plans:[{name:"Monthly",price:"$1.00 / month",note:"First week free for new subscribers"},
           {name:"Yearly",price:"$10.00 / year",note:"No free trial"}],
    fine:"Prices are listed in USD; the App Store charges the equivalent in your local currency, and the amount shown on the App Store product page is final. The subscription renews automatically unless cancelled at least 24 hours before the current period ends.",
    cancel:"Cancel any time in Settings → Apple Account → Subscriptions. Cancelling stops the next renewal and the current period stays active until it ends."},
  faq:{title:"FAQ",sub:"Short answers; the user guide has the details.",items:[{q:"Do you upload my data?",a:"No. Everything you create lives in an encrypted SQLCipher database on your device. There is no account and no server of ours. The only copies that leave the device go to your own iCloud Drive, and only when you export or when the automatic backup runs."},
    {q:"Where is my health data stored?",a:"Two parts. ① What you record in the app (workouts and calories, weight and body fat, body temperature, symptoms and more) is written into Apple Health — and most of what Apple Health holds comes from Apple Watch. ② The app’s encrypted database keeps only daily/hourly summaries and the index used to speed up queries: raw samples are never uploaded and are excluded from backups. A few symptoms that Apple Health has no category for stay on this device only.Whether Apple Health itself syncs with iCloud is up to your system settings."},
    {q:"Does the built-in AI need internet?",a:"No. The bundled model (about 0.8B parameters) runs on the device. Speech-to-text is performed on the device whenever the system supports it; if it does not, Apple’s speech service handles the audio and only the recognised text comes back, to be parsed locally."},
    {q:"How do I move to a new iPhone?",a:"Automatic backups go to your own iCloud Drive (without photos and without health data), and you can also export a backup file by hand from Settings → Backup. Restoring merges — it never deletes."},
    {q:"Do I need to register?",a:"No. There is no account system: open the app and the encrypted database is created locally."},
    {q:"Are there ads or third-party analytics SDKs?",a:"No. There is no server, no advertising, no sign-up, and no third-party analytics, advertising or tracking SDK — only Apple’s own frameworks (HealthKit, Photos, WeatherKit, MapKit, StoreKit)."},
    {q:"Which languages are supported?",a:"English, Simplified Chinese, Traditional Chinese, Japanese, Korean, German, French and Spanish."},
    {q:"How does billing and cancellation work?",a:"The App Store charges your Apple Account. The monthly plan starts with one free week for new subscribers, then renews at $1.00 per month; the yearly plan is $10.00 per year. Cancel any time in Settings → Apple Account → Subscriptions."},
    {q:"Where do weather and map data come from?",a:"Weather comes from Apple Weather; the traffic map, routes and travel times come from Apple Maps. Only the coordinates or the start and end points in use are sent — never your records, photos or health data."}]},

    {q:"換新 iPhone 怎麼移轉？",a:"自動備份會寫進你自己的 iCloud Drive（不含照片、不含健康資料），也可以在「設定 → 備份」裡手動匯出一份檔案。回復是合併，不會刪除既有資料。"},

  modulesNote:"3 つの機能は端末内の同じ暗号化データを共有します。サーバーなし、広告なし、登録不要、第三者の解析 SDK もありません。",
  about:{title:"開発者について",lead:"国際金融企業のシステム開発に長年携わってきた開発者たちです。",paragraphs:["私たちは、国際金融企業のシステム開発に長年携わってきた開発者の集まりです。私たちの願いは、人々の生活を本当に良くするソフトウェアを、自分たちの手で作ることです。長年の金融システム開発の現場で、私たちは多くの人より直接的に知りました。プライバシーは機能リストの一行ではなく、すべての体験の土台であり出発点だということです。利用者のデータへの敬意がなければ、他の機能も成り立ちません。","そのため、製品設計ではいくつか簡単ではない選択をしました。利用者のデータはすべて暗号化し、あなたの iPhone または iPad の中だけで処理します。日常の利用にネット接続もトークンも不要です。端末の外に出る可能性があるのは、あなた自身が有効にした最小限の暗号化バックアップだけで、しかもご自身の iCloud にのみ保存されます。端末内 AI を入れたのは、入力と検索の体験を良くするためであり、便利さと引き換えにデータを外へ出すためではありません。","オフラインを前提にこれを実現するのが容易でないこと、一日で終わる話でないことも分かっています。それでも続けたいのは、データの主導権を本当に利用者へ返したいからです。最終的に信頼に値するかは、あなたに確かめていただくほかありません。フィードバックには真摯に追随し、改善していきます。"]},
  privacy:{title:"プライバシー最優先",sub:"アカウント不要、サーバーなし、トラッキングなし。",label:"基本方針",
    body:"PigPigPlan はローカル優先の家計簿・個人データ管理アプリです。アプリ内で作成されたすべてのデータ（健康データを含む）はお客様のデバイス内にのみ保存され、サーバーにアップロードされることはありません。エクスポートは常にユーザー自身が開始・管理します。内蔵 AI（音声入力の整理、自然言語クエリ、健康 Q&A、意味検索）は、アプリに同梱された小型モデル（約 0.8B パラメータ）により端末内で動作し、ネット接続は不要です。音声の文字起こしは可能な限り端末内で行い、認識されたテキストは端末内でのみ処理され、当方のサーバーにはアップロードされません。"},

  faq:{title:"よくある質問",sub:"簡潔な回答です。詳しい操作は操作ガイドをご覧ください。",items:[{q:"データはアップロードされますか？",a:"いいえ。作成した内容はすべて端末内の SQLCipher 暗号化データベースに保存されます。アカウントも当方のサーバーもありません。端末外に出るのはご自身の iCloud Drive 内のコピーのみで、書き出しや自動バックアップの実行時に限られます。"},

    {q:"新しい iPhone への移行は？",a:"自動バックアップはご自身の iCloud Drive に保存されます（写真と健康データは含みません）。「設定 → バックアップ」から手動で書き出すこともできます。復元は統合で、既存データは削除されません。"},
    {q:"登録は必要ですか？",a:"不要です。アカウント制度はなく、アプリを開くと端末内に暗号化データベースが作成されます。"},
    {q:"広告や第三者の解析 SDK はありますか？",a:"ありません。サーバーも広告も登録もなく、第三者の解析・広告・トラッキング SDK も組み込んでいません。使うのは Apple のシステムフレームワーク（HealthKit、Photos、WeatherKit、MapKit、StoreKit）だけです。"},
    {q:"対応言語は？",a:"英語、簡体字中国語、繁体字中国語、日本語、韓国語、ドイツ語、フランス語、スペイン語に対応しています。"},
    {q:"料金と解約はどうなりますか？",a:"App Store が Apple アカウントに請求します。月額は新規購読者の最初の 1 週間が無料で、その後 $1.00/月。年額は $10.00/年です。「設定 → Apple アカウント → サブスクリプション」からいつでも解約できます。"},

  reports:{title:"한 번 물으면, 리포트가 나옵니다.",

      "권한을 허용한 카테고리만 읽고(운동, 걸음 수, 서 있는 시간, 심박, HRV, 호흡, 수면, 체온, 혈중 산소, 체중 등) 추세·최대·최소·평균을 기기에서 계산합니다. 고정 리포트는 바로 열 수 있습니다.",
      "음성으로 Apple 건강에 기록 추가: 운동 종류와 소모 칼로리, 체중과 체지방, 체온, 증상 등. 확인하면 ‘건강’ 앱에 바로 기록됩니다.",

    {key:"album",name:"앨범",goal:"목표: 사진에 담긴 GPS와 날짜를 활용해 Apple 사진 정리를 더 쉽게.",points:[

  about:{title:"만든 사람들",lead:"국제 금융회사 시스템을 오래 개발해 온 개발자들입니다.",paragraphs:["저희는 국제 금융회사의 시스템을 오랫동안 개발해 온 개발자 모임입니다. 바람은 사람들의 삶을 실제로 개선하는 소프트웨어를 직접 만드는 것입니다. 오랜 금융 시스템 개발 현장에서 저희는 많은 사람보다 더 직접적으로 알게 되었습니다. 개인정보 보호는 기능 목록의 한 항목이 아니라 모든 경험의 바닥이자 출발점이라는 점을요. 사용자 데이터에 대한 존중이 없으면 다른 기능도 성립하지 않습니다.","그래서 제품 설계에서 쉽지 않은 선택을 몇 가지 했습니다. 사용자 데이터는 전부 암호화하고, 오직 당신의 iPhone 또는 iPad 안에서만 처리합니다. 일상적인 사용에는 인터넷도 토큰도 필요 없습니다. 기기 밖으로 나갈 수 있는 것은 당신이 직접 켠 최소한의 암호화 백업뿐이며, 그것도 당신의 iCloud에만 저장됩니다. 기기 내 AI를 넣은 이유는 입력과 검색 경험을 개선하기 위해서이지, 편의를 위해 데이터를 내보내기 위해서가 아닙니다.","오프라인을 전제로 이 모든 것을 구현하는 일이 쉽지 않고 하루 만에 끝나지 않는다는 점도 잘 압니다. 그래도 계속하려는 이유는 데이터에 대한 통제권을 진짜로 사용자에게 돌려주고 싶기 때문입니다. 결과가 신뢰할 만한지는 당신이 판단할 몫이며, 저희는 피드백을 성실히 따라가며 개선하겠습니다."]},
  privacy:{title:"개인정보 우선",sub:"계정 없음, 서버 없음, 추적 없음.",label:"핵심 약속",
    body:"PigPigPlan은 로컬 우선(local-first) 방식의 가계부·개인 데이터 관리 앱입니다. 앱에서 생성하는 모든 데이터(건강 데이터 포함)는 사용자 기기에만 저장되며 어떤 서버에도 업로드되지 않습니다. 내보내기는 항상 사용자가 직접 시작합니다. 내장 AI(음성 입력 정리, 자연어 쿼리, 건강 Q&A, 의미 검색)는 앱에 포함된 소형 모델(약 0.8B 파라미터)로 기기에서 실행되며 인터넷 연결이 필요 없습니다. 음성-텍스트 변환은 가능하면 기기에서 수행하고, 인식된 텍스트는 기기에서만 처리되며 당사 서버로 업로드되지 않습니다."},
  pricing:{title:"구독 요금",sub:"구독 하나로 모든 기능을 사용할 수 있고, 언제든 취소할 수 있습니다.",
    plans:[{name:"월간",price:"$1.00 / 월",note:"신규 구독자는 첫 주 무료"},
           {name:"연간",price:"$10.00 / 년",note:"무료 체험 없음"}],
    fine:"가격은 미국 달러 기준입니다. App Store는 거주 지역 통화로 청구하며, 최종 금액은 App Store 제품 페이지에 표시된 금액입니다. 현재 기간 종료 24시간 전까지 취소하지 않으면 자동 갱신됩니다.",
    cancel:"설정 → Apple 계정 → 구독에서 언제든 취소할 수 있습니다. 취소하면 다음 갱신이 중단되고 현재 기간이 끝날 때까지는 사용할 수 있습니다."},
  faq:{title:"자주 묻는 질문",sub:"간단한 답변입니다. 자세한 사용법은 사용 안내를 참고하세요.",items:[{q:"데이터가 업로드되나요?",a:"아니요. 만든 모든 내용은 기기 안의 SQLCipher 암호화 데이터베이스에 저장됩니다. 계정도, 저희 서버도 없습니다. 기기 밖으로 나가는 것은 사용자가 직접 내보내거나 자동 백업이 실행될 때 본인 iCloud Drive에 생기는 사본뿐입니다."},
    {q:"건강 데이터는 어디에 저장되나요?",a:"두 부분입니다. ① 앱에서 입력한 기록(운동과 소모 칼로리, 체중·체지방, 체온, 증상 등)은 Apple 건강에 기록되며, Apple 건강의 주된 데이터 출처는 Apple Watch입니다. ② 앱의 암호화 데이터베이스에는 조회를 빠르게 하기 위한 일별/시간별 통계 요약과 색인만 저장합니다. 원본 샘플은 업로드되지 않고 백업에도 포함되지 않습니다. Apple 건강에 해당 분류가 없는 일부 증상은 기기에만 저장됩니다.Apple 건강 자체가 iCloud와 동기화되는지는 시스템 설정에 따릅니다."},
    {q:"내장 AI는 인터넷이 필요한가요?",a:"아니요. 앱에 포함된 소형 모델(약 0.8B 파라미터)이 기기에서 실행됩니다. 음성-텍스트 변환은 가능하면 기기에서 수행하고, 지원되지 않으면 Apple 음성 서비스가 오디오를 처리해 인식된 텍스트만 기기로 돌려보내 로컬에서 분석합니다."},
    {q:"새 iPhone으로 어떻게 옮기나요?",a:"자동 백업은 본인 iCloud Drive에 저장됩니다(사진과 건강 데이터 제외). ‘설정 → 백업’에서 파일로 직접 내보낼 수도 있습니다. 복원은 병합이며 기존 데이터를 삭제하지 않습니다."},
    {q:"가입이 필요한가요?",a:"필요 없습니다. 계정 체계가 없고, 앱을 열면 기기 안에 암호화 데이터베이스가 만들어집니다."},
    {q:"광고나 타사 분석 SDK가 있나요?",a:"없습니다. 서버도, 광고도, 가입도 없으며 타사 분석·광고·추적 SDK를 넣지 않았습니다. 사용하는 것은 Apple 시스템 프레임워크(HealthKit, Photos, WeatherKit, MapKit, StoreKit)뿐입니다."},
    {q:"어떤 언어를 지원하나요?",a:"영어, 중국어 간체, 중국어 번체, 일본어, 한국어, 독일어, 프랑스어, 스페인어를 지원합니다."},
    {q:"요금과 취소는 어떻게 되나요?",a:"App Store가 Apple 계정으로 청구합니다. 월간은 신규 구독자 첫 주 무료 후 $1.00/월, 연간은 $10.00/년입니다. 설정 → Apple 계정 → 구독에서 언제든 취소할 수 있습니다."},
    {q:"날씨와 지도 데이터는 어디서 오나요?",a:"날씨는 Apple Weather, 교통 지도·경로·소요 시간은 Apple Maps에서 가져옵니다. 사용 중인 좌표나 출발지·도착지만 전송되며, 기록·사진·건강 데이터는 전송되지 않습니다."}]},

  modulesNote:"Alle drei teilen eine verschlüsselte Datenbank auf deinem Gerät: kein Server, keine Werbung, keine Anmeldung und kein Analyse-SDK von Drittanbietern.",
  about:{title:"Wer dahintersteht",lead:"Ein Team von Entwicklern mit langjähriger Erfahrung in Systemen für internationale Finanzunternehmen.",paragraphs:["Wir sind eine Gruppe von Entwicklern, die viele Jahre Systeme für internationale Finanzunternehmen gebaut haben. Unser Wunsch ist, eigenständig Software zu entwickeln, die das Leben der Menschen tatsächlich verbessert. Aus der langen Arbeit an Finanzsystemen wissen wir direkter als viele andere: Datenschutz ist kein Punkt auf einer Funktionsliste, sondern die Grundlage und der Ausgangspunkt jeder Erfahrung. Ohne Respekt vor den Daten der Nutzer trägt nichts anderes.","Deshalb haben wir ein paar Entscheidungen getroffen, die nicht leicht waren: Alle Nutzerdaten werden verschlüsselt und ausschließlich auf deinem iPhone oder iPad verarbeitet; der Alltag braucht kein Internet und kein Token. Das Einzige, was das Gerät verlassen kann, ist die minimale verschlüsselte Sicherung, die du selbst einschaltest – und sie liegt nur in deiner eigenen iCloud. Die KI auf dem Gerät haben wir eingebaut, um Eingabe und Suche zu verbessern, nicht um Daten gegen Bequemlichkeit zu tauschen.","Uns ist klar, dass das offline nicht einfach ist und nicht an einem Tag fertig wird. Wir bleiben trotzdem dran, weil wir die Kontrolle über die Daten wirklich an dich zurückgeben wollen. Ob das Ergebnis Vertrauen verdient, kannst nur du beurteilen – und wir freuen uns sehr über dein Feedback und bessern nach."]},
  privacy:{title:"Datenschutz von Anfang an",sub:"Kein Konto. Kein Server. Kein Tracking.",label:"Kernversprechen",
    body:"PigPigPlan ist eine lokale, datenschutzorientierte App für Finanzen und persönliche Datenverwaltung. Alle in der App erstellten Daten (einschließlich Gesundheitsdaten) werden ausschließlich auf Ihrem Gerät gespeichert und niemals auf einen Server hochgeladen. Exporte lösen immer Sie selbst aus. Die integrierte KI (Spracheingabe, natürlichsprachige Abfragen, Gesundheits-Q&A, semantische Suche) läuft auf einem mitgelieferten kleinen Modell (ca. 0,8 Mrd. Parameter) vollständig auf Ihrem Gerät – ohne Internetverbindung. Die Spracherkennung erfolgt möglichst on-device; der erkannte Text wird ausschließlich on-device verarbeitet und nie auf unsere Server hochgeladen."},
  pricing:{title:"Preis",sub:"Ein Abo schaltet alles frei. Jederzeit kündbar.",
    plans:[{name:"Monatlich",price:"$1.00 / Monat",note:"Erste Woche für neue Abonnenten kostenlos"},
           {name:"Jährlich",price:"$10.00 / Jahr",note:"Keine kostenlose Testphase"}],
    fine:"Preise in USD; der App Store rechnet in Ihrer Landeswährung ab, maßgeblich ist der im App Store angezeigte Betrag. Das Abo verlängert sich automatisch, wenn es nicht mindestens 24 Stunden vor Ende der aktuellen Periode gekündigt wird.",
    cancel:"Jederzeit kündbar unter Einstellungen → Apple Account → Abonnements. Die Kündigung stoppt die nächste Verlängerung; die aktuelle Periode läuft bis zum Ende weiter."},
  faq:{title:"Häufige Fragen",sub:"Kurze Antworten; Details stehen in der Anleitung.",items:[{q:"Werden meine Daten hochgeladen?",a:"Nein. Alles, was Sie erstellen, liegt in einer verschlüsselten SQLCipher-Datenbank auf Ihrem Gerät. Es gibt kein Konto und keinen Server von uns. Das Gerät verlassen nur Kopien in Ihrem eigenen iCloud Drive – und nur, wenn Sie exportieren oder die automatische Sicherung läuft."},
    {q:"Wo liegen meine Gesundheitsdaten?",a:"Zwei Teile. ① Was du in der App erfasst (Training und Kalorien, Gewicht und Körperfett, Körpertemperatur, Symptome und mehr), wird in Apple Health geschrieben – und der größte Teil dort kommt von der Apple Watch. ② Die verschlüsselte Datenbank der App hält nur Tages-/Stundenzusammenfassungen und den Index für schnellere Abfragen: Rohdaten werden nie hochgeladen und sind von Sicherungen ausgeschlossen. Einige Symptome ohne passende Kategorie in Apple Health bleiben nur auf diesem Gerät.Ob Apple Health selbst mit iCloud synchronisiert, hängt von deinen Systemeinstellungen ab."},
    {q:"Braucht die integrierte KI Internet?",a:"Nein. Das mitgelieferte Modell (ca. 0,8 Mrd. Parameter) läuft auf dem Gerät. Die Spracherkennung erfolgt möglichst on-device; falls nicht unterstützt, verarbeitet Apples Sprachdienst die Audiodaten, und nur der erkannte Text kommt zurück und wird lokal ausgewertet."},
    {q:"Wie wechsle ich auf ein neues iPhone?",a:"Automatische Sicherungen gehen in Ihr eigenes iCloud Drive (ohne Fotos und ohne Gesundheitsdaten). Unter Einstellungen → Backup können Sie zusätzlich eine Datei exportieren. Wiederherstellen führt zusammen und löscht nie."},
    {q:"Muss ich mich registrieren?",a:"Nein. Es gibt kein Kontosystem: App öffnen, die verschlüsselte Datenbank wird lokal angelegt."},
    {q:"Gibt es Werbung oder Analyse-SDKs von Drittanbietern?",a:"Nein. Es gibt keinen Server, keine Werbung, keine Anmeldung und kein Analyse-, Werbe- oder Tracking-SDK von Drittanbietern – nur Apples eigene Frameworks (HealthKit, Photos, WeatherKit, MapKit, StoreKit)."},
    {q:"Welche Sprachen werden unterstützt?",a:"Englisch, vereinfachtes Chinesisch, traditionelles Chinesisch, Japanisch, Koreanisch, Deutsch, Französisch und Spanisch."},
    {q:"Wie funktionieren Abrechnung und Kündigung?",a:"Der App Store belastet Ihren Apple Account. Das Monatsabo startet für neue Abonnenten mit einer kostenlosen Woche und verlängert sich dann für $1.00 pro Monat; das Jahresabo kostet $10.00 pro Jahr. Kündbar jederzeit unter Einstellungen → Apple Account → Abonnements."},
    {q:"Woher kommen Wetter- und Kartendaten?",a:"Wetter von Apple Weather; Verkehrskarte, Routen und Fahrzeiten von Apple Maps. Gesendet werden nur die verwendeten Koordinaten bzw. Start und Ziel – nie Ihre Daten, Fotos oder Gesundheitsdaten."}]},

  modulesNote:"Les trois partagent une seule base chiffrée sur votre appareil : sans serveur, sans publicité, sans inscription, et sans SDK d’analyse tiers.",
  about:{title:"Qui nous sommes",lead:"Une équipe de développeurs qui construit depuis des années des systèmes pour des sociétés financières internationales.",paragraphs:["Nous sommes un groupe de développeurs qui a passé des années à construire des systèmes pour des sociétés financières internationales. Notre souhait est de créer de façon indépendante des logiciels qui améliorent réellement la vie des gens. À force de travailler sur des systèmes financiers, nous avons compris plus directement que beaucoup d’autres : la confidentialité n’est pas une ligne dans une liste de fonctionnalités, c’est le socle et le point de départ de toute expérience. Sans respect des données des utilisateurs, rien d’autre ne tient.","C’est pourquoi nous avons fait quelques choix qui n’étaient pas faciles. Toutes les données sont chiffrées et traitées uniquement sur votre iPhone ou iPad ; l’usage quotidien ne demande ni Internet ni jeton. La seule chose qui peut quitter l’appareil est la sauvegarde chiffrée minimale que vous activez vous-même, et elle reste dans votre propre iCloud. Nous avons ajouté une IA embarquée pour améliorer la saisie et la recherche, pas pour échanger des données contre du confort.","Nous savons que faire tout cela hors ligne n’est pas simple et ne se termine pas en un jour. Nous continuons parce que nous voulons réellement rendre le contrôle des données à l’utilisateur. Savoir si le résultat mérite votre confiance ne dépend que de vous — et nous serons très heureux de suivre vos retours et d’améliorer."]},
  privacy:{title:"Confidentialité dès la conception",sub:"Sans compte. Sans serveur. Sans pistage.",label:"Engagement principal",
    body:"PigPigPlan est une application locale et respectueuse de la vie privée pour la gestion des finances et des données personnelles. Toutes les données que vous créez dans l’application (y compris les données de santé) sont stockées uniquement sur votre appareil, ne sont jamais téléchargées sur un serveur, et l’exportation est toujours initiée et contrôlée par vous. L’IA intégrée (saisie vocale, requêtes en langage naturel, Q&R santé, recherche sémantique) s’exécute sur un petit modèle embarqué (environ 0,8 Md de paramètres), sans connexion Internet ; la transcription vocale est effectuée sur l’appareil lorsque c’est possible, et le texte reconnu n’est jamais envoyé à nos serveurs."},

    fine:"Les prix sont indiqués en USD ; l’App Store facture l’équivalent dans votre devise locale et le montant affiché sur la page produit de l’App Store fait foi. L’abonnement se renouvelle automatiquement sauf résiliation au moins 24 heures avant la fin de la période en cours.",
    cancel:"Résiliez à tout moment dans Réglages → Compte Apple → Abonnements. La résiliation arrête le prochain renouvellement ; la période en cours reste active jusqu’à son terme."},
  faq:{title:"Questions fréquentes",sub:"Réponses courtes ; le guide contient les détails.",items:[{q:"Mes données sont-elles envoyées ?",a:"Non. Tout ce que vous créez reste dans une base SQLCipher chiffrée sur votre appareil. Il n’y a ni compte ni serveur de notre côté. Les seules copies qui quittent l’appareil vont dans votre propre iCloud Drive, et seulement lors d’un export ou de la sauvegarde automatique."},
    {q:"Où sont stockées mes données de santé ?",a:"Deux parties. ① Ce que vous saisissez dans l’app (activité et calories, poids et masse grasse, température, symptômes, etc.) est écrit dans Apple Santé — dont l’essentiel provient de l’Apple Watch. ② La base chiffrée de l’app ne contient que des résumés quotidiens/horaires et l’index qui accélère les requêtes : les échantillons bruts ne sont jamais envoyés et sont exclus des sauvegardes. Quelques symptômes sans catégorie correspondante dans Apple Santé restent uniquement sur cet appareil.La synchronisation d’Apple Santé avec iCloud dépend de vos réglages système."},
    {q:"L’IA intégrée a-t-elle besoin d’Internet ?",a:"Non. Le modèle embarqué (environ 0,8 Md de paramètres) s’exécute sur l’appareil. La transcription vocale est faite sur l’appareil quand le système le permet ; sinon, le service vocal d’Apple traite l’audio et seul le texte reconnu revient pour être analysé localement."},

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function param(k){var m=new RegExp("[?&]"+k+"=([^&#]*)").exec(location.search||"");return m?decodeURIComponent(m[1].replace(/\+/g," ")):null}
/* 语言码归一：zh-Hans / zh-CN → zh-Hans；zh-TW / zh-HK → zh-Hant；en-US → en（与 index.html 一致） */
function normLang(q){
  if(!q)return null;
  if(MKT[q])return q;
  var s=String(q).toLowerCase();
  if(s.indexOf("zh")===0){
    if(s.indexOf("hant")>=0||s.indexOf("tw")>=0||s.indexOf("hk")>=0||s.indexOf("mo")>=0)return "zh-Hant";
    return "zh-Hans";
  }
  var base=s.split("-")[0];
  return MKT[base]?base:null;
}
